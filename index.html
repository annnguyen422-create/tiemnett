<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFB84D">
<title>Tiệm Net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--pri:#FFB84D;--sec:#FF7A59;--acc:#5CC8A1;--bg:#FFF7EA;--dark:#303030;--ok:#58B368;--warn:#F2B84B;--bad:#E85D5D;--blue:#5B9DEF;--muted:#7a6f63;--line:#efdcc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--dark);font-family:Nunito,system-ui,sans-serif;font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--dark);background:#fff;border-radius:12px;min-height:44px;padding:4px 12px;line-height:1.2}
button:active{transform:scale(.96)}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.pri{background:var(--pri)} button.ok{background:var(--acc)} button.danger{background:#FDE5E5}
button.sm{min-height:36px;font-size:13px;padding:2px 8px;border-radius:10px}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap;background:#fff;border-bottom:2px solid var(--dark)}
.chip{padding:5px 10px;border-radius:999px;background:var(--bg);border:2px solid var(--dark);font-size:14px;white-space:nowrap}
#bStatus{min-height:34px;border-radius:999px;font-weight:900;font-size:13px}
#bStatus.prep{background:var(--pri);animation:pulse 1s infinite alternate}
#bStatus.open{background:var(--ok);color:#fff} #bStatus.closing{background:var(--warn)} #bStatus.report{background:#eee}
@keyframes pulse{to{transform:scale(1.06)}}
#speeds{margin-left:auto;display:flex;gap:4px}
#speeds button{min-height:36px;min-width:44px;padding:0 6px;font-size:13px;border-radius:10px}
#speeds button.on{background:var(--dark);color:#fff}
#hint{display:flex;align-items:center;gap:8px;padding:2px 10px;font-size:14px;background:#FFF0D6;border-bottom:2px solid var(--line);min-height:46px}
#vp{flex:1;overflow:auto;position:relative}
#wrap{position:relative;margin:0 auto}
#world{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0;overflow:hidden;border-radius:0 0 18px 18px;
background:linear-gradient(#F3D3A4 0 28px,#8a6a4a 28px 31px,transparent 31px),repeating-conic-gradient(#FBE8C8 0 25%,#F6DDB6 0 50%) 0 0/48px 48px}
.ent{position:absolute;left:0;top:0}
[data-act]{cursor:pointer}
[data-act]:hover svg{filter:drop-shadow(0 0 3px #FFB84D) drop-shadow(0 0 2px #FFB84D)}
.kfloor{left:20px;top:31px;width:670px;height:150px;background:repeating-linear-gradient(90deg,#eef2ee 0 24px,#e3e9e4 24px 48px);border-radius:0 0 14px 14px;z-index:1}
.pcrug{left:312px;top:186px;width:620px;height:340px;background:rgba(91,157,239,.07);border:2px dashed rgba(91,157,239,.35);border-radius:22px;z-index:1}
.lbl,.zone{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:999px;font-size:11px;font-weight:900;padding:0 8px;white-space:nowrap;pointer-events:none}
.zone{transform:none;left:auto;bottom:auto;z-index:5}
.slot{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--dark);border-radius:10px;padding:2px 4px;font-size:11px;text-align:center;width:64px;display:none;line-height:1.15;pointer-events:none}
.slot svg{display:block;margin:0 auto}
.slot .pb{height:5px;background:#eee;border-radius:3px;overflow:hidden;margin-top:2px}
.slot .pb i{display:block;height:100%;background:var(--pri)}
.slot.done{background:#E5F6EC;border-color:var(--ok);animation:sp .5s infinite alternate}
@keyframes sp{to{transform:translate(-50%,-50%) scale(1.08)}}
.pc .desk,.pc .chair,.pc .tag{position:absolute;left:0}
.pc .chair{top:60px}
.pc .tag{top:108px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff;border:2px solid var(--dark);border-radius:8px;padding:0 6px;text-align:center;white-space:nowrap;line-height:1.25;pointer-events:none}
.pc .scr{fill:#3d4454;transition:fill .3s} .pc .game{display:none}
.pc[data-s="OCCUPIED"] .scr{fill:#27406e} .pc[data-s="OCCUPIED"] .game{display:inline;animation:blink 1.2s infinite}
.pc[data-s="RESERVED"] .scr{fill:#F2B84B}
.pc[data-s="AVAILABLE"] .st{color:#2f8a47} .pc[data-s="OCCUPIED"] .st{color:#2f63b5} .pc[data-s="RESERVED"] .st{color:#a86b00}
.pc.pick .desk{animation:pick .7s infinite alternate}
@keyframes pick{to{filter:drop-shadow(0 0 8px #5CC8A1) drop-shadow(0 0 3px #5CC8A1)}}
@keyframes blink{50%{opacity:.5}}
.cust,.player{width:40px;height:56px}
.spr{width:40px;height:56px;transform-origin:50% 100%}
.walking .spr{animation:bob .25s infinite alternate}
@keyframes bob{to{translate:0 -2px}}
.bub{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:12px;padding:3px 8px;font-size:12px;white-space:nowrap;line-height:1.3;display:none;text-align:center;font-weight:800}
.bub.on{display:block} .bub.order.on{display:flex;gap:2px;padding:3px 5px;border-color:var(--sec);border-width:2.5px}
.bub small{display:block;font-size:11px;color:var(--muted)}
.bub.money{background:#FFF3C4}
.bub:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--dark);border-bottom:0}
.pat{position:absolute;bottom:-9px;left:4px;width:32px;height:6px;background:#eee;border:1.5px solid var(--dark);border-radius:4px;overflow:hidden;display:none}
.pat i{display:block;height:100%}
.ptag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--pri);border:2px solid var(--dark);border-radius:999px;padding:0 6px;font-weight:900}
.float{position:absolute;width:120px;margin-left:-60px;text-align:center;font-weight:900;font-size:18px;pointer-events:none;z-index:3000;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff,0 -1px 0 #fff}
@keyframes up{to{transform:translateY(-44px);opacity:0}}
#bar{display:flex;justify-content:space-around;padding:4px;background:#fff;border-top:2px solid var(--dark);padding-bottom:calc(4px + env(safe-area-inset-bottom))}
#bar button{border:none;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:58px;background:none;padding:2px}
#bar button span:first-child{font-size:20px}
#tray{position:fixed;left:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:2px solid var(--dark);border-radius:14px;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
#tray.has{background:#FFF0D6}
#trayItems{display:flex;gap:4px}
#trayItems button{min-height:44px;min-width:44px;padding:2px;border-radius:10px}
#sheetBg{position:fixed;inset:0;background:rgba(48,48,48,.35);display:none;z-index:50}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:78vh;overflow:auto;background:#fff;border:2px solid var(--dark);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:51;display:none;animation:sh .2s}
@keyframes sh{from{transform:translate(-50%,30px);opacity:0}}
#sheet h2,#sheet h3{margin:0 0 8px;font-weight:900} #sheet h4{margin:14px 0 6px;font-weight:900}
.x{float:right;min-height:40px;width:40px;padding:0;border-radius:50%;margin-left:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
.grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative}
.grid small,.item small{font-size:11px;color:var(--muted);display:block}
.cnt{position:absolute;top:-9px;right:-6px;background:var(--sec);color:#fff;border-radius:999px;font-style:normal;font-size:12px;padding:0 7px;border:2px solid var(--dark)}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1.5px solid var(--dark);white-space:nowrap}
.badge.warn{background:#FFE9B3} .badge.ok{background:#DDF3E3} .badge.acc{background:#D8F3EA}
.muted{color:var(--muted);font-size:13px}
.say{font-size:16px;font-weight:900;background:var(--bg);border-radius:12px;padding:8px 12px;margin:8px 0}
.eq{background:#E5F6EC;border-radius:10px;padding:6px 10px;margin:6px 0;font-size:14px}
.head{display:flex;align-items:center;gap:10px}
.item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item button{display:flex;flex-direction:column;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:12px} .stat b{font-size:18px}
.card{border:2px solid var(--dark);border-radius:14px;padding:8px 12px;margin:8px 0}
.total{border-bottom:none;font-weight:900}
.profit .big{font-size:28px;font-weight:900} .profit.pos{background:#E5F6EC} .profit.neg{background:#FDE5E5}
.okc{color:#2f8a47} .badc{color:#c94141} .warnc{color:#a86b00}
.btns{display:flex;gap:8px;margin-top:12px} .btns button{flex:1} .btns.col{flex-direction:column}
.wide{width:100%;margin-top:12px}
.empty{text-align:center;padding:16px;color:var(--muted)}
.barrow{display:grid;grid-template-columns:1.2fr 2fr 34px;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--pri)}
.log{display:grid;grid-template-columns:44px 96px 1fr;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--dark);border-radius:999px;padding:1px 8px 1px 3px;font-size:12px;margin:2px}
.pill.done{text-decoration:line-through;color:var(--muted)}
.mrow{display:grid;grid-template-columns:24px 1fr 52px 96px;align-items:center;gap:6px;font-size:14px;padding:3px 0}
.trow{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px} .trow small{display:block}
.center{text-align:center}
#toasts{position:fixed;top:110px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--dark);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;animation:sh .2s;text-align:center}
.toast.ok{background:#2f8a47} .toast.bad{background:#c94141}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.player{pointer-events:none}
.wallmenu{left:600px;top:7px;z-index:3;font-size:11px;font-weight:900;color:#5a3a22;white-space:nowrap}
.ks{position:absolute;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ks.empty{border:2px dashed rgba(48,48,48,.28)}
.ks.sel{outline:3px solid var(--blue);outline-offset:1px}
.ks.warn{animation:kw .35s infinite alternate}
@keyframes kw{to{transform:scale(1.08)}}
.ks.shaking svg{animation:shk .18s infinite alternate}
@keyframes shk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.ks .tb{position:absolute;left:1px;right:1px;bottom:-8px;height:7px;background:#cfcfcf;border:1.5px solid #303030;border-radius:4px;overflow:hidden}
.ks .tb i{position:absolute;top:0;bottom:0}
.ks .tb .zp{background:#58B368} .ks .tb .zo{background:#F2B84B}
.ks .tb b{position:absolute;top:0;bottom:0;width:3px;background:#303030;margin-left:-1px}
.ks .bd{position:absolute;top:-8px;right:-8px;font-size:11px;background:#fff;border:1.5px solid #303030;border-radius:999px;padding:0 4px;line-height:1.4}
.ks .bd.ok{background:#DDF3E3}
.kbn{position:absolute;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);border:1.5px solid #303030;border-radius:7px;cursor:pointer}
.kbn.out{opacity:.35}
.player .hand{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:10px;padding:1px;line-height:0;display:none}
#kbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:42;background:#fff;border-top:2px solid var(--dark);display:none;flex-direction:column;gap:4px;padding:6px 8px}
.kbt{display:flex;gap:10px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.kbs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 2px}
.kbs button{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:3px 6px;border-radius:10px}
.kbs button small{font-size:11px;color:var(--muted)}
.kbs button.sel{background:#E6F1FB;border-color:var(--blue)}
.kbs button.out{opacity:.4}
.kbw{position:relative;flex:none;display:flex}
.kbw .mini{position:absolute;top:-8px;right:-8px;min-width:0;min-height:0;width:26px;height:26px;padding:0;border-radius:50%;font-size:11px;background:#FDE5E5}
.slotnum{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border:2px dashed #bbb;border-radius:8px;color:var(--muted)}
body.kb #tray{bottom:calc(58px + 118px + env(safe-area-inset-bottom))}
#trayItems{align-items:center}
#trayItems button{position:relative}
#trayItems button.confirm{background:#FDE5E5;border-color:var(--bad)}
#trayItems .q{position:absolute;top:-7px;right:-7px;font-style:normal;font-size:11px;background:var(--warn);border-radius:999px;padding:0 4px;border:1px solid #303030}
#trayItems .sep{width:2px;align-self:stretch;background:var(--line);margin:0 4px}
</style>
</head>

function addTx(amount,type,desc){amount=Math.round(amount);S.money+=amount;
 S.tx.push({transactionId:'TX'+(++S.seq.tx),type,amount,timestamp:Date.now(),day:S.day,gameTime:Math.floor(S.time),description:desc});
 if(S.tx.length>3000)S.tx.shift()}
function recharge(c,amount){
 amount=Math.round(Number(amount));
 if(!c||!(amount>0))return{ok:false,err:'err_amount'};
 if(c.state==='LEAVING')return{ok:false,err:'err_cust'};
 if(amount>availableCash(c))return{ok:false,err:'err_wallet'};
 const before=c.balance;c.money-=amount;c.balance+=amount;
 addTx(amount,'RECHARGE',t('tx_recharge',{name:c.name}));S.today.recharge+=amount;
 if(c.rechargeReq){c.happiness=clamp(c.happiness+(amount>=c.rechargeReq?8:3),0,100);c.rechargeReq=0}
 if(c.state==='RECHARGE')c.state=c.order?'WAITING_FOOD':'PLAYING';
 if(c.askAmt)c.askAmt=Math.max(0,c.askAmt-amount);
 fx.sfx('cash');fx.float(c.x,c.y-74,'+'+vnd(amount),'#2f8a47');
 return{ok:true,before,after:c.balance}}
function buyStock(id,qty){
 const it=ITEM_BY[id];qty=Math.floor(qty);
 if(!it||!(qty>0))return{ok:false,err:'err_generic'};
 if(S.phase==='REPORT')return{ok:false,err:'err_report'};
 const cost=it.cost*qty;if(S.money<cost)return{ok:false,err:'err_money'};
 S.inv[id]+=qty;addTx(-cost,'INVENTORY_PURCHASE',t('tx_buy',{n:qty,unit:it.unit,item:itemName(id)}));S.today.purchases+=cost;
 return{ok:true,cost}}

function hasIng(R){for(const k in R.ing)if((S.inv[k]||0)<R.ing[k])return k;return null}
function consume(R){for(const k in R.ing)S.inv[k]-=R.ing[k]}
function startCook(st,rid){
 const R=MENU_BY[rid];if(!R||R.station!==st||!S.stations[st])return{ok:false,err:'err_generic'};
 const slots=S.stations[st],i=slots.indexOf(null);if(i<0)return{ok:false,err:'err_station_busy'};
 const miss=hasIng(R);if(miss)return{ok:false,err:'err_stock',item:itemName(miss)};
 consume(R);slots[i]={r:rid,t:0,done:false};fx.sfx(st==='fryer'?'fry':'pop');return{ok:true,i}}
function takeFridge(rid){
 const R=MENU_BY[rid];if(!R||R.station!=='fridge')return{ok:false,err:'err_generic'};
 if(S.tray.length>=CFG.TRAY_MAX)return{ok:false,err:'tray_full'};
 const miss=hasIng(R);if(miss)return{ok:false,err:'err_stock',item:itemName(miss)};
 consume(R);S.tray.push(rid);return{ok:true}}
function pickUp(st){
 const slots=S.stations[st];if(!slots)return{ok:false,err:'err_generic'};
 const i=slots.findIndex(s=>s&&s.done);if(i<0)return{ok:false,err:'err_nothing'};
 if(S.tray.length>=CFG.TRAY_MAX)return{ok:false,err:'tray_full'};
 const r=slots[i].r;S.tray.push(r);slots[i]=null;return{ok:true,r}}
function discardTray(i){if(i<0||i>=S.tray.length)return null;return S.tray.splice(i,1)[0]}
function stationTick(dt){for(const st in S.stations)for(const s of S.stations[st])if(s&&!s.done){s.t+=dt;if(s.t>=MENU_BY[s.r].time){s.done=true;fx.sfx('ding')}}}
function pendingNeeds(){
 const need={};for(const c of S.customers)if(c.order)for(const it of c.order.items)if(!it.done)need[it.r]=(need[it.r]||0)+1;
 for(const r of S.tray)if(need[r])need[r]--;
 for(const k in S.stations)for(const s of S.stations[k])if(s&&need[s.r])need[s.r]--;
 for(const r in need)if(need[r]<=0)delete need[r];return need}

function moveTo(c,x,y,dt){const dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy),st=CFG.WALK*dt;

 while(st>0&&c.path.length){const p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);if(Math.abs(dx)>1)c.flip=dx<0;
  if(d<=st){c.x=p.x;c.y=p.y;c.path.shift();st-=d}else{c.x+=dx/d*st;c.y+=dy/d*st;st=0}}

   c.rechargePatience=Math.max(c.rechargePatience,c.rechargePatienceMax);say(c,line(c.joke?'more':'recharge',{amt:vk(amt)}))}

 c.balance-=cost;pc.revenue+=cost;pc.sessionTime+=dt;S.today.pcUsage+=cost;S.today.pcMinutes+=dt;c.played+=dt;

 else if(c.state==='PLAYING'&&!c.order&&S.phase==='OPEN'&&S.time-c.lastOrderT>=25&&(c.hunger>=60||c.thirst>=60))maybeOrder(c,false);
 if(c.rechargeReq){c.rechargePatience-=dt;if(c.rechargePatience<=0){c.rechargeReq=0;c.reqCooldown=S.time+60;c.happiness=clamp(c.happiness-10,0,100)}}
 else if(c.balance<pc.hourlyRate/60*12&&c.played<c.gamingTime-20&&S.time>=c.reqCooldown){

  case'ENTER':case'WAITING':{const q=queueSpot(Math.min(queueIndex(c),7));const arrived=moveTo(c,q.x,q.y,dt);

function walkTo(x,y,cb){UI.walk={x,y,cb}}
function movePlayer(dt){const w=UI.walk;if(!w)return;const p=S.player,dx=w.x-p.x,dy=w.y-p.y,d=Math.hypot(dx,dy),st=CFG.PLAYER_SPEED*dt*(S.speed>=2?1.5:1);
 if(Math.abs(dx)>1)p.flip=dx<0;if(d<=st){p.x=w.x;p.y=w.y;UI.walk=null;if(w.cb)w.cb()}else{p.x+=dx/d*st;p.y+=dy/d*st}}
function doAssign(c,pc){if(!c||!pc)return;const r=assignPC(c,pc);if(!r.ok){fx.err(r.err);return}
 fx.toast(t('toast_assigned',{name:c.name,id:pad(pc.id)}),'ok');fx.sfx('pop');closeSheet()}
function interactSeated(id){const c=custById(id);if(!c||!isSeated(c))return;
 if(c.order){const d=deliverTo(c);if(d.n){fx.toast(t('toast_deliver',{n:d.n,money:vnd(d.earned)}),'ok');if(!c.rechargeReq&&c.state!=='RECHARGE')return}else if(S.tray.length)fx.toast(t('toast_nomatch'))}

function interactStation(id){
 if(id==='fridge'){openSheet('station','fridge');return}
 const slots=S.stations[id];
 if(slots.some(s=>s&&s.done)){const r=pickUp(id);if(r.ok){fx.toast(t('toast_pick',{item:menuName(r.r)}),'ok');fx.sfx('pop')}else fx.err(r.err);return}
 if(!slots.includes(null)){fx.err('err_station_busy',{st:t('st_'+id)});return}
 openSheet('station',id)}
function onWorld(e){
 const el=e.target.closest('[data-act]');
 if(UI.sheet&&UI.sheet.kind==='counter'&&el&&el.dataset.act==='pc'){const pc=pcById(+el.dataset.id),c=custById(UI.sheet.id);if(pc&&c&&pc.status==='AVAILABLE'){doAssign(c,pc);return}}
 if(!el||S.phase==='REPORT')return;
 if(UI.sheet&&UI.sheet.kind==='counter')closeSheet();
 const act=el.dataset.act,id=el.dataset.id;
 if(act==='pc'){openSheet('pc',+id);return}
 if(act==='cust'){const c=custById(+id);if(!c)return;
  if(c.state==='ENTER'||c.state==='WAITING')walkTo(CFG.COUNTER_SPOT.x,CFG.COUNTER_SPOT.y,()=>{const cc=custById(c.id);if(cc&&(cc.state==='ENTER'||cc.state==='WAITING'))openSheet('counter',c.id)});
  else if(isSeated(c)){const s=seatOf(pcById(c.pcId));walkTo(s.x+36,s.y-2,()=>interactSeated(c.id))}
  return}
 if(act==='counter'){walkTo(CFG.COUNTER_SPOT.x,CFG.COUNTER_SPOT.y,()=>{const c=S.customers.find(x=>x.state==='WAITING');if(c)openSheet('counter',c.id);else fx.toast(t('no_queue'))});return}
 if(act==='st'){const s=STATIONS[id];
  if(id==='storage'){walkTo(s.spot[0],s.spot[1],()=>openSheet('inv'));return}
  if(S.phase!=='OPEN'&&S.phase!=='CLOSING'){fx.err('err_closed');return}
  walkTo(s.spot[0],s.spot[1],()=>interactStation(id))}}

let last=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000||0);last=now;
 if(!S.paused&&(S.phase==='OPEN'||S.phase==='CLOSING')){let m=dt*CFG.MIN_PER_SEC*S.speed;while(m>1e-6){const d=Math.min(1,m);stepSim(d);m-=d}}
 movePlayer(dt);renderTop();renderPCs();renderStations();renderCustomers();renderPlayer();renderTray();
 if(now-UI.hintT>400){UI.hintT=now;setT($('hintTx'),hintText())}

/* ---------- helpers ---------- */
const KO=step=>({ok:true,step}),KE=(err,v)=>({ok:false,err,v});
function emptyKitchen(){return{board:[null,null,null],stove:[null,null],fryer:[null,null],bar:[null,null]}}
function cookState(t,p){return t<p.T?'under':t<p.T+p.ok?'perfect':t<p.T+p.ruin?'over':'ruined'}
function itemPrice(it){const R=MENU_BY[it.r];return(R?R.price:0)+(it.top||[]).reduce((s,x)=>s+(TOPPINGS[x]?TOPPINGS[x].price:0),0)}
function dishLabel(it){return menuName(it.r)+((it.top&&it.top.length)?' + '+it.top.map(x=>t('top_'+x)).join(', '):'')}
const dishName=d=>dishLabel(d);
function sameTop(a,b){a=a||[];b=b||[];return a.length===b.length&&a.every(x=>b.includes(x))}
function cashFree(c){return c.money-(c.order?c.order.items.filter(i=>!i.done).reduce((a,i)=>a+itemPrice(i),0):0)}
function mixRecipe(w){for(const r in MIX)if(MIX[r].base===w.base&&MIX[r].flavor===w.flavor)return r;return null}
function binName(st,id){return st==='fridge'?itemName(id):t('bin_'+id)}
function wiName(w){if(!w)return'—';switch(w.k){
 case'pack':return t('bin_'+w.b)+' ('+t('pack_sfx')+')';case'raw':return t('bin_'+w.b)+' ('+t('ck_raw')+')';
 case'bowl':case'pot':return dishLabel({r:NOODLE_R[w.b],top:w.top});case'fried':return menuName(FRY_R[w.b])+' · '+t('ck_'+w.cook);
 case'fry':return menuName(FRY_R[w.b]);case'plate':return menuName(FRY_R[w.b])+(w.sauce?'':' ('+t('no_sauce')+')');
 case'cup':return[w.ice?t('bin_da'):'',w.base?t('bin_'+w.base):'',w.flavor?t('bin_'+w.flavor):''].filter(Boolean).join(' + ')||t('bin_ly');
 case'trash':return t('step_RUINED')}return'—'}
function pickTarget(st,pred){const a=S.k[st],s=S.sel[st];if(s!=null&&a[s]&&pred(a[s]))return s;const i=a.findIndex(w=>w&&pred(w));if(i>=0)S.sel[st]=i;return i}

/* ---------- kitchen logic (không đụng DOM) ---------- */
function placeCup(i){if(S.k.bar[i])return KE('err_station_busy',{st:t('st_bar')});if(!S.inv.ly)return KE('err_stock',{item:itemName('ly')});
 S.inv.ly--;S.k.bar[i]={k:'cup',st:'open',ice:false,base:null,flavor:null};S.sel.bar=i;return KO('TAKE_CUP')}
function kBin(st,id){
 const K=KIT[st];if(!K||!(K.bins||[]).some(b=>b[0]===id))return KE('err_generic');
 const h=S.hand,has=()=>id==='da'||(S.inv[id]||0)>0;
 if(st==='noodlebox'||st==='freezer'){if(h)return KE('err_hand_full',{item:wiName(h)});if(!has())return KE('err_stock',{item:itemName(id)});
  S.inv[id]--;S.hand={k:st==='noodlebox'?'pack':'raw',b:id};return KO(st==='noodlebox'?'TAKE_NOODLES':'TAKE_FRY')}
 if(st==='fridge'){if(S.tray.length>=CFG.TRAY_MAX)return KE('tray_full');if(!has())return KE('err_stock',{item:itemName(id)});
  S.inv[id]--;S.tray.push({r:id,top:[],q:100});return KO('TAKE_DRINK')}
 if(st==='board'){
  if(id==='tuong'){const i=pickTarget('board',w=>w.k==='plate'&&!w.sauce);if(i<0)return KE('err_no_target_sauce');if(!has())return KE('err_stock',{item:itemName(id)});
   S.inv.tuong--;S.k.board[i].sauce=true;return KO('ADD_SAUCE')}
  const i=pickTarget('board',w=>w.k==='bowl'&&(w.st==='bowl'||w.st==='seasoned')&&!w.top.includes(id)&&w.top.length<3);
  if(i<0)return KE('err_no_target_top');if(!has())return KE('err_stock',{item:itemName(id)});
  S.inv[id]--;S.k.board[i].top.push(id);return KO('ADD_TOPPING')}
 if(st==='bar'){
  if(id==='ly'){const i=S.k.bar.indexOf(null);if(i<0)return KE('err_station_busy',{st:t('st_bar')});return placeCup(i)}
  const slot=id==='da'?'ice':BASES.includes(id)?'base':'flavor';
  const i=pickTarget('bar',w=>w.st==='open'&&!w[slot]);if(i<0)return KE('err_no_target_cup');if(!has())return KE('err_stock',{item:itemName(id)});
  if(id!=='da')S.inv[id]--;S.k.bar[i][slot]=id==='da'?true:id;
  return KO(slot==='ice'?'ADD_ICE':slot==='base'?'ADD_BASE':'ADD_FLAVOR')}
 return KE('err_generic')}
function kTap(st,i){
 const arr=S.k[st];if(!arr||!(i>=0&&i<arr.length))return KE('err_generic');
 const w=arr[i],h=S.hand;if(st==='board'||st==='bar')S.sel[st]=i;
 if(st==='board'){
  if(!w){
   if(h&&h.k==='pack'){arr[i]={k:'bowl',b:h.b,st:'pack',top:[],ws:h.ws};S.hand=null;return KO('PLACE_PACK')}
   if(h&&h.k==='bowl'){arr[i]={k:'bowl',b:h.b,st:'seasoned',top:h.top.slice(),ws:h.ws};S.hand=null;return KO('PUT_BACK')}
   if(h&&h.k==='fried'){if(!S.inv.dia)return KE('err_stock',{item:itemName('dia')});S.inv.dia--;arr[i]={k:'plate',b:h.b,cook:h.cook,sauce:false,ws:h.ws};S.hand=null;return KO('PUT_ON_PLATE')}
   return h?KE('err_wrong_place',{item:wiName(h)}):KE('err_empty_spot')}
  if(w.k==='bowl'){
   if(w.st==='pack'){w.st='open';return KO('OPEN_PACK')}
   if(w.st==='open'){if(!S.inv.to)return KE('err_stock',{item:itemName('to')});S.inv.to--;w.st='bowl';return KO('PUT_IN_BOWL')}
   if(w.st==='bowl'){w.st='seasoned';return KO('ADD_SEASONING')}
   if(h)return KE('err_hand_full',{item:wiName(h)});
   S.hand={k:'bowl',b:w.b,st:'seasoned',top:w.top.slice(),ws:w.ws};arr[i]=null;return KO('PICK_BOWL')}
  if(w.k==='plate'){if(!w.sauce)return KE('err_need_sauce');if(S.tray.length>=CFG.TRAY_MAX)return KE('tray_full');
   S.tray.push({r:FRY_R[w.b],top:[],q:QUAL.fried[w.cook]||50});arr[i]=null;return KO('SERVE_READY')}
  return KE('err_generic')}
 if(st==='stove'){
  if(!w){if(h&&h.k==='bowl'){arr[i]={k:'pot',b:h.b,top:h.top.slice(),t:0,ws:h.ws};S.hand=null;return KO('COOK')}
   return h?KE('err_wrong_place',{item:wiName(h)}):KE('err_empty_spot')}
  const cs=cookState(w.t,COOK.noodle);
  if(cs==='ruined'){if(h)return KE('err_hand_full',{item:wiName(h)});S.hand={k:'trash'};arr[i]=null;return KO('RUINED')}
  if(S.tray.length>=CFG.TRAY_MAX)return KE('tray_full');
  S.tray.push({r:NOODLE_R[w.b],top:w.top.slice(),q:QUAL.noodle[cs]});arr[i]=null;return KO('TAKE_OUT')}
 if(st==='fryer'){
  if(!w){if(h&&h.k==='raw'){arr[i]={k:'fry',b:h.b,t:0,ws:h.ws};S.hand=null;return KO('PUT_IN_FRYER')}
   return h?KE('err_wrong_place',{item:wiName(h)}):KE('err_empty_spot')}
  if(h)return KE('err_hand_full',{item:wiName(h)});
  const cs=cookState(w.t,COOK.fried);S.hand=cs==='ruined'?{k:'trash'}:{k:'fried',b:w.b,cook:cs,ws:w.ws};arr[i]=null;
  return KO(cs==='ruined'?'RUINED':'REMOVE')}
 if(st==='bar'){
  if(!w)return placeCup(i);
  if(w.st==='open'){if(!w.base)return KE('err_need_base');if(!w.flavor)return KE('err_need_flavor');w.st='shaking';w.t=0;return KO('SHAKE')}
  if(w.st==='shaking')return KE('err_shaking');
  const r=mixRecipe(w);
  if(!r){if(h)return KE('err_hand_full',{item:wiName(h)});S.hand={k:'trash'};arr[i]=null;return KO('BAD_MIX')}
  if(S.tray.length>=CFG.TRAY_MAX)return KE('tray_full');
  S.tray.push({r,top:[],q:w.ice?100:80});arr[i]=null;return KO('SERVE_READY')}
 return KE('err_generic')}
function kTrash(){if(!S.hand)return KE('err_hand_empty');S.hand=null;return KO('TRASH')}
function kDiscard(st,i){if((st!=='board'&&st!=='bar')||!S.k[st]||!S.k[st][i])return KE('err_empty_spot');S.k[st][i]=null;return KO('DISCARD')}
function stationTick(dt){
 for(const[st,p]of[['stove',COOK.noodle],['fryer',COOK.fried]])for(const w of S.k[st])if(w){
  const a=cookState(w.t,p);w.t+=dt;const b=cookState(w.t,p);if(a!==b){if(b==='perfect')fx.sfx('ding');else if(b==='ruined')fx.sfx('error')}}
 for(const w of S.k.bar)if(w&&w.st==='shaking'){w.t+=dt;if(w.t>=COOK.shake){w.st='done';fx.sfx('ding')}}}

/* ---------- state / save (v2) ---------- */
function newState(){
 const s={v:CFG.VERSION,day:1,time:CFG.OPEN-30,phase:'PREP',speed:1,paused:false,money:CFG.START_MONEY,rating:4,
  pcs:PC_LAYOUT.map((p,i)=>({id:i+1,tier:p[0],x:p[1],y:p[2],status:'AVAILABLE',condition:100,performance:PC_TIERS[p[0]].perf,hourlyRate:PC_TIERS[p[0]].rate,currentCustomer:null,sessionTime:0,revenue:0})),
  inv:Object.fromEntries(ITEMS.map(i=>[i.id,i.start])),k:emptyKitchen(),hand:null,sel:{},
  tray:[],customers:[],accounts:{},tx:[],history:[],seq:{c:0,tx:0,order:1000},player:{x:CFG.COUNTER_SPOT.x,y:CFG.COUNTER_SPOT.y,flip:false},
  today:null,report:null,settings:{sound:true},tutorialDone:false};
 s.today=freshToday(s.money);return s}
function mapOld(r){const L=LEGACY[r];return L?{r:L[0],top:L[1].slice()}:{r,top:[]}}
function migrateV1(d){
 d.v=2;const inv=d.inv||{};inv.tra=(inv.tra||0)+(inv.trachanh||0);delete inv.trachanh;
 for(const it of ITEMS)if(inv[it.id]==null)inv[it.id]=it.start;d.inv=inv;
 d.k=emptyKitchen();d.hand=null;d.sel={};delete d.stations;
 d.tray=(d.tray||[]).map(r=>{const m=mapOld(r);return{r:m.r,top:m.top,q:100}}).filter(x=>MENU_BY[x.r]);
 for(const c of d.customers||[]){
  if(c.order){c.order.items=c.order.items.map(it=>{const m=mapOld(it.r);return{r:m.r,top:it.top||m.top,done:!!it.done}}).filter(it=>MENU_BY[it.r]);if(!c.order.items.length)c.order=null}
  if(!c.order&&c.state==='WAITING_FOOD')c.state='PLAYING';
  c.preferredFood=mapOld(c.preferredFood).r;c.preferredDrink=mapOld(c.preferredDrink).r;
  if(!MENU_BY[c.preferredFood])c.preferredFood='mi_tom';if(!MENU_BY[c.preferredDrink])c.preferredDrink='water'}
 const fixSold=o=>{if(!o)return o;const s={};for(const k in o){const r=mapOld(k).r;s[r]=(s[r]||0)+o[k]}return s};
 if(d.today)d.today.sold=fixSold(d.today.sold);if(d.report)d.report.sold=fixSold(d.report.sold)}
function deserialize(str){
 const d=JSON.parse(str);if(!d||typeof d!=='object')throw new Error('bad');
 if(d.v===1){migrateV1(d);d._migrated=true}
 if(d.v!==CFG.VERSION)throw new Error('version');
 const out=Object.assign(newState(),d);
 out.inv=Object.assign(Object.fromEntries(ITEMS.map(i=>[i.id,0])),d.inv||{});
 out.settings=Object.assign({sound:true},d.settings||{});
 out.k=Object.assign(emptyKitchen(),d.k||{});out.sel=d.sel||{};out.hand=d.hand||null;out.tray=Array.isArray(d.tray)?d.tray:[];
 return out}
function loadGame(){let s=null;try{s=localStorage.getItem(CFG.KEY)}catch(e){return null}if(!s)return null;
 try{const d=deserialize(s);if(d._migrated){delete d._migrated;UI.migrated=true}return d}
 catch(e){try{localStorage.setItem(CFG.KEY+'_backup_'+Date.now(),s)}catch(_){}UI.saveBad=true;return null}}
function endDay(){
 if(S.phase==='REPORT')return S.report;
 const d=S.today,elec=CFG.ELEC_BASE+Math.round(d.pcMinutes/60*CFG.ELEC_PC_HOUR);
 addTx(-elec,'ELECTRICITY',t('exp_elec'));addTx(-CFG.INTERNET,'INTERNET',t('exp_net'));addTx(-CFG.MAINT,'REPAIR',t('exp_maint'));
 const rev={recharge:d.recharge,food:d.food,drink:d.drink},revenue=d.recharge+d.food+d.drink;
 const exp={purchases:d.purchases,elec,internet:CFG.INTERNET,maint:CFG.MAINT},expense=exp.purchases+elec+exp.internet+exp.maint;
 S.report={day:S.day,rev,revenue,exp,expense,profit:revenue-expense,pcUsage:Math.round(d.pcUsage),pcHours:d.pcMinutes/60,visitors:d.visitors,served:d.served,left:d.left,orders:d.orders,failed:d.ordersFailed,sat:d.happyN?Math.round(d.happySum/d.happyN):0,sold:{...d.sold}};
 S.history.push({day:S.day,revenue,expense,profit:revenue-expense});if(S.history.length>60)S.history.shift();
 S.phase='REPORT';S.k=emptyKitchen();S.hand=null;S.sel={};S.tray=[];return S.report}

/* ---------- orders / delivery / money ---------- */
function recharge(c,amount){
 amount=Math.round(Number(amount));if(!c||!(amount>0))return{ok:false,err:'err_amount'};
 if(c.state==='LEAVING')return{ok:false,err:'err_cust'};if(amount>cashFree(c))return{ok:false,err:'err_wallet'};
 const before=c.balance;c.money-=amount;c.balance+=amount;addTx(amount,'RECHARGE',t('tx_recharge',{name:c.name}));S.today.recharge+=amount;
 if(c.rechargeReq){c.happiness=clamp(c.happiness+(amount>=c.rechargeReq?8:3),0,100);c.rechargeReq=0}
 if(c.state==='RECHARGE')c.state=c.order?'WAITING_FOOD':'PLAYING';if(c.askAmt)c.askAmt=Math.max(0,c.askAmt-amount);
 fx.sfx('cash');fx.float(c.x,c.y-74,'+'+vnd(amount),'#2f8a47');return{ok:true,before,after:c.balance}}
function reqAmount(c){const T=CT[c.type];const a=rint(T.recharge[0]/10000,T.recharge[1]/10000)*10000;return Math.max(0,Math.min(a,Math.floor(cashFree(c)/10000)*10000))}
function maybeOrder(c,force){
 const T=CT[c.type],items=[];let budget=c.money;
 const add=(r,top)=>{if(!MENU_BY[r])return false;const it={r,top:top||[],done:false},p=itemPrice(it);if(p<=budget){items.push(it);budget-=p;return true}return false};
 if(c.hunger>=60||force){const f=(MENU_BY[c.preferredFood]&&Math.random()<.6)?c.preferredFood:pick(T.foods);const top=[];
  if(MENU_BY[f]&&MENU_BY[f].type==='noodle'){if(Math.random()<.55)top.push(pick(TOP_IDS));if(Math.random()<.15){const x=pick(TOP_IDS);if(!top.includes(x))top.push(x)}}
  if(!add(f,top))add(f,[]);if(Math.random()<.2)add(pick(['cavien','bovien','tomvien','xx_chien','holo']),[])}
 if(c.thirst>=60||(items.length&&Math.random()<.5))add((MENU_BY[c.preferredDrink]&&Math.random()<.6)?c.preferredDrink:pick(T.drinks),[]);
 c.lastOrderT=S.time;if(!items.length)return false;
 c.order={id:++S.seq.order,items,t:S.time};c.state='WAITING_FOOD';c.orderPatienceMax=Math.round(70*T.pat);c.orderPatience=c.orderPatienceMax;
 S.today.orders++;say(c,line('order'),8);fx.sfx('notify');return true}
function deliverTo(c){
 const res={n:0,earned:0,gain:0,minQ:100};if(!c||!c.order)return res;
 for(const it of c.order.items){if(it.done)continue;
  let k=-1,best=-1;S.tray.forEach((d,j)=>{if(d.r!==it.r)return;const sc=(sameTop(it.top,d.top)?1000:0)+d.q;if(sc>best){best=sc;k=j}});
  if(k<0)continue;
  const d=S.tray.splice(k,1)[0];it.done=true;const R=MENU_BY[it.r],price=itemPrice(it);
  c.money=Math.max(0,c.money-price);addTx(price,R.kind==='food'?'FOOD_SALE':'DRINK_SALE',dishLabel(it)+' — '+c.name);
  S.today[R.kind]+=price;S.today.sold[it.r]=(S.today.sold[it.r]||0)+1;if(R.kind==='food')c.hunger=0;else c.thirst=0;
  const miss=(it.top||[]).filter(x=>!(d.top||[]).includes(x)).length,q=clamp(d.q-miss*20,0,100);
  res.gain+=q>=90?8:q>=70?4:q>=50?0:-8;res.minQ=Math.min(res.minQ,q);res.n++;res.earned+=price}
 if(res.n){if(c.orderPatience>c.orderPatienceMax*.5)res.gain+=4;c.happiness=clamp(c.happiness+res.gain,0,100);
  fx.sfx('cash');fx.float(c.x,c.y-80,'+'+vnd(res.earned),'#2f8a47');fx.float(c.x+24,c.y-58,(res.gain>=0?'❤ +':'💔 ')+res.gain,res.gain>=0?'#E85D5D':'#7a6f63');
  finishOrderIfDone(c);if(res.minQ<50)say(c,line('bad'),14);else if(res.minQ<70)say(c,line('meh'),12)}
 return res}
function pendingNeeds(){const need={},pool=S.tray.slice();for(const c of S.customers)if(c.order)for(const it of c.order.items){if(it.done)continue;
 const j=pool.findIndex(d=>d.r===it.r);if(j>=0){pool.splice(j,1);continue}const k=dishLabel(it);need[k]=(need[k]||0)+1}return need}
function firstNeed(){const pool=S.tray.slice();for(const c of S.customers)if(c.order)for(const it of c.order.items){if(it.done)continue;
 const j=pool.findIndex(d=>d.r===it.r);if(j>=0){pool.splice(j,1);continue}return it}return null}
function trayMatches(){for(const c of S.customers)if(c.order&&c.order.items.some(it=>!it.done&&S.tray.some(d=>d.r===it.r)))return c;return null}

/* ---------- thao tác trên map ---------- */
function walkTo(x,y,cb){UI.walk={x,y,cb};UI.at=null}
function uiK(r){if(!r)return;if(!r.ok){fx.err(r.err,r.v);return}
 const bad=r.step==='RUINED'||r.step==='BAD_MIX';
 fx.float(S.player.x,S.player.y-64,t('step_'+r.step),bad?'#c94141':'#303030');
 fx.sfx({PUT_IN_FRYER:'fry',COOK:'fry',RUINED:'error',BAD_MIX:'error',SERVE_READY:'ding',TAKE_OUT:'ding',SHAKE:'notify'}[r.step]||'pop')}
function onWorld(e){
 const el=e.target.closest('[data-act]');
 if(UI.sheet&&UI.sheet.kind==='counter'&&el&&el.dataset.act==='pc'){const pc=pcById(+el.dataset.id),c=custById(UI.sheet.id);if(pc&&c&&pc.status==='AVAILABLE'){doAssign(c,pc);return}}
 if(!el||S.phase==='REPORT')return;
 const act=el.dataset.act,id=el.dataset.id;
 if(act==='pc'){openSheet('pc',+id);return}
 if(S.paused){fx.err('err_paused');return}
 if(UI.sheet&&UI.sheet.kind==='counter')closeSheet();
 if(act==='cust'){const c=custById(+id);if(!c)return;
  if(c.state==='ENTER'||c.state==='WAITING')walkTo(CFG.COUNTER_SPOT.x,CFG.COUNTER_SPOT.y,()=>{const cc=custById(c.id);if(cc&&(cc.state==='ENTER'||cc.state==='WAITING'))openSheet('counter',c.id)});
  else if(isSeated(c)){const s=seatOf(pcById(c.pcId));walkTo(s.x+36,s.y-2,()=>interactSeated(c.id))}
  return}
 if(act==='counter'){walkTo(CFG.COUNTER_SPOT.x,CFG.COUNTER_SPOT.y,()=>{const c=S.customers.find(x=>x.state==='WAITING');if(c)openSheet('counter',c.id);else fx.toast(t('no_queue'))});return}
 if(act==='storage'){walkTo(54,KIT_SPOT_Y,()=>openSheet('inv'));return}
 if(act==='kst'||act==='spot'||act==='bin'){
  const parts=String(id).split(':'),st=parts[0],K=KIT[st];if(!K)return;
  if(S.phase!=='OPEN'&&S.phase!=='CLOSING'){fx.err('err_closed');return}
  const run=()=>{UI.at=st;if(act==='spot')uiK(kTap(st,+parts[1]));else if(act==='bin')uiK(kBin(st,parts[1]));else if(st==='trash'&&S.hand)uiK(kTrash())};
  if(UI.at===st&&!UI.walk)run();else walkTo(K.x+K.w/2,KIT_SPOT_Y,run)}}

  const sel=!!(w&&(st==='board'||st==='bar')&&S.sel[st]===i);
  const key=w?[w.k,w.b,w.st,(w.top||[]).join(''),w.sauce,w.ice,w.base,w.flavor,w.cook,cs,sel].join('|'):'empty';
  if(el._k!==key){el._k=key;el.className='ks'+(w?'':' empty')+(sel?' sel':'')+(cs==='over'?' warn':'')+(w&&w.st==='shaking'?' shaking':'');
