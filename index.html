<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFB84D">
<title>Tiệm Net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--pri:#FFB84D;--sec:#FF7A59;--acc:#5CC8A1;--bg:#FFF7EA;--dark:#303030;--ok:#58B368;--warn:#F2B84B;--bad:#E85D5D;--blue:#5B9DEF;--muted:#7a6f63;--line:#efdcc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--dark);font-family:Nunito,system-ui,sans-serif;font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--dark);background:#fff;border-radius:12px;min-height:44px;padding:4px 12px;line-height:1.2}
button:active{transform:scale(.96)}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.pri{background:var(--pri)} button.ok{background:var(--acc)} button.danger{background:#FDE5E5}
button.sm{min-height:36px;font-size:13px;padding:2px 8px;border-radius:10px}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap;background:#fff;border-bottom:2px solid var(--dark)}
.chip{padding:5px 10px;border-radius:999px;background:var(--bg);border:2px solid var(--dark);font-size:14px;white-space:nowrap}
#bStatus{min-height:34px;border-radius:999px;font-weight:900;font-size:13px}
#bStatus.prep{background:var(--pri);animation:pulse 1s infinite alternate}
#bStatus.open{background:var(--ok);color:#fff} #bStatus.closing{background:var(--warn)} #bStatus.report{background:#eee}
@keyframes pulse{to{transform:scale(1.06)}}
#speeds{margin-left:auto;display:flex;gap:4px}
#speeds button{min-height:36px;min-width:44px;padding:0 6px;font-size:13px;border-radius:10px}
#speeds button.on{background:var(--dark);color:#fff}
#hint{display:flex;align-items:center;gap:8px;padding:2px 10px;font-size:14px;background:#FFF0D6;border-bottom:2px solid var(--line);min-height:46px}
#vp{flex:1;overflow:auto;position:relative}
#wrap{position:relative;margin:0 auto}
#world{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0;overflow:hidden;border-radius:0 0 18px 18px;
background:linear-gradient(#F3D3A4 0 28px,#8a6a4a 28px 31px,transparent 31px),repeating-conic-gradient(#FBE8C8 0 25%,#F6DDB6 0 50%) 0 0/48px 48px}
.ent{position:absolute;left:0;top:0}
[data-act]{cursor:pointer}
[data-act]:hover svg{filter:drop-shadow(0 0 3px #FFB84D) drop-shadow(0 0 2px #FFB84D)}
.kfloor{left:20px;top:31px;width:670px;height:150px;background:repeating-linear-gradient(90deg,#eef2ee 0 24px,#e3e9e4 24px 48px);border-radius:0 0 14px 14px;z-index:1}
.pcrug{left:312px;top:186px;width:620px;height:340px;background:rgba(91,157,239,.07);border:2px dashed rgba(91,157,239,.35);border-radius:22px;z-index:1}
.lbl,.zone{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:999px;font-size:11px;font-weight:900;padding:0 8px;white-space:nowrap;pointer-events:none}
.zone{transform:none;left:auto;bottom:auto;z-index:5}
.slot{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--dark);border-radius:10px;padding:2px 4px;font-size:11px;text-align:center;width:64px;display:none;line-height:1.15;pointer-events:none}
.slot svg{display:block;margin:0 auto}
.slot .pb{height:5px;background:#eee;border-radius:3px;overflow:hidden;margin-top:2px}
.slot .pb i{display:block;height:100%;background:var(--pri)}
.slot.done{background:#E5F6EC;border-color:var(--ok);animation:sp .5s infinite alternate}
@keyframes sp{to{transform:translate(-50%,-50%) scale(1.08)}}
.pc .desk,.pc .chair,.pc .tag{position:absolute;left:0}
.pc .chair{top:60px}
.pc .tag{top:108px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff;border:2px solid var(--dark);border-radius:8px;padding:0 6px;text-align:center;white-space:nowrap;line-height:1.25;pointer-events:none}
.pc .scr{fill:#3d4454;transition:fill .3s} .pc .game{display:none}
.pc[data-s="OCCUPIED"] .scr{fill:#27406e} .pc[data-s="OCCUPIED"] .game{display:inline;animation:blink 1.2s infinite}
.pc[data-s="RESERVED"] .scr{fill:#F2B84B}
.pc[data-s="AVAILABLE"] .st{color:#2f8a47} .pc[data-s="OCCUPIED"] .st{color:#2f63b5} .pc[data-s="RESERVED"] .st{color:#a86b00}
.pc.pick .desk{animation:pick .7s infinite alternate}
@keyframes pick{to{filter:drop-shadow(0 0 8px #5CC8A1) drop-shadow(0 0 3px #5CC8A1)}}
@keyframes blink{50%{opacity:.5}}
.cust,.player{width:40px;height:56px}
.spr{width:40px;height:56px;transform-origin:50% 100%}
.walking .spr{animation:bob .25s infinite alternate}
@keyframes bob{to{translate:0 -2px}}
.bub{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:12px;padding:3px 8px;font-size:12px;white-space:nowrap;line-height:1.3;display:none;text-align:center;font-weight:800}
.bub.on{display:block} .bub.order.on{display:flex;gap:2px;padding:3px 5px;border-color:var(--sec);border-width:2.5px}
.bub small{display:block;font-size:11px;color:var(--muted)}
.bub.money{background:#FFF3C4}
.bub:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--dark);border-bottom:0}
.pat{position:absolute;bottom:-9px;left:4px;width:32px;height:6px;background:#eee;border:1.5px solid var(--dark);border-radius:4px;overflow:hidden;display:none}
.pat i{display:block;height:100%}
.ptag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--pri);border:2px solid var(--dark);border-radius:999px;padding:0 6px;font-weight:900}
.float{position:absolute;width:120px;margin-left:-60px;text-align:center;font-weight:900;font-size:18px;pointer-events:none;z-index:3000;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff,0 -1px 0 #fff}
@keyframes up{to{transform:translateY(-44px);opacity:0}}
#bar{display:flex;justify-content:space-around;padding:4px;background:#fff;border-top:2px solid var(--dark);padding-bottom:calc(4px + env(safe-area-inset-bottom))}
#bar button{border:none;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:58px;background:none;padding:2px}
#bar button span:first-child{font-size:20px}
#tray{position:fixed;left:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:2px solid var(--dark);border-radius:14px;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
#tray.has{background:#FFF0D6}
#trayItems{display:flex;gap:4px}
#trayItems button{min-height:44px;min-width:44px;padding:2px;border-radius:10px}
#sheetBg{position:fixed;inset:0;background:rgba(48,48,48,.35);display:none;z-index:50}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:78vh;overflow:auto;background:#fff;border:2px solid var(--dark);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:51;display:none;animation:sh .2s}
@keyframes sh{from{transform:translate(-50%,30px);opacity:0}}
#sheet h2,#sheet h3{margin:0 0 8px;font-weight:900} #sheet h4{margin:14px 0 6px;font-weight:900}
.x{float:right;min-height:40px;width:40px;padding:0;border-radius:50%;margin-left:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
.grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative}
.grid small,.item small{font-size:11px;color:var(--muted);display:block}
.cnt{position:absolute;top:-9px;right:-6px;background:var(--sec);color:#fff;border-radius:999px;font-style:normal;font-size:12px;padding:0 7px;border:2px solid var(--dark)}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1.5px solid var(--dark);white-space:nowrap}
.badge.warn{background:#FFE9B3} .badge.ok{background:#DDF3E3} .badge.acc{background:#D8F3EA}
.muted{color:var(--muted);font-size:13px}
.say{font-size:16px;font-weight:900;background:var(--bg);border-radius:12px;padding:8px 12px;margin:8px 0}
.eq{background:#E5F6EC;border-radius:10px;padding:6px 10px;margin:6px 0;font-size:14px}
.head{display:flex;align-items:center;gap:10px}
.item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item button{display:flex;flex-direction:column;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:12px} .stat b{font-size:18px}
.card{border:2px solid var(--dark);border-radius:14px;padding:8px 12px;margin:8px 0}
.total{border-bottom:none;font-weight:900}
.profit .big{font-size:28px;font-weight:900} .profit.pos{background:#E5F6EC} .profit.neg{background:#FDE5E5}
.okc{color:#2f8a47} .badc{color:#c94141} .warnc{color:#a86b00}
.btns{display:flex;gap:8px;margin-top:12px} .btns button{flex:1} .btns.col{flex-direction:column}
.wide{width:100%;margin-top:12px}
.empty{text-align:center;padding:16px;color:var(--muted)}
.barrow{display:grid;grid-template-columns:1.2fr 2fr 34px;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--pri)}
.log{display:grid;grid-template-columns:44px 96px 1fr;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--dark);border-radius:999px;padding:1px 8px 1px 3px;font-size:12px;margin:2px}
.pill.done{text-decoration:line-through;color:var(--muted)}
.mrow{display:grid;grid-template-columns:24px 1fr 52px 96px;align-items:center;gap:6px;font-size:14px;padding:3px 0}
.trow{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px} .trow small{display:block}
.center{text-align:center}
#toasts{position:fixed;top:110px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--dark);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;animation:sh .2s;text-align:center}
.toast.ok{background:#2f8a47} .toast.bad{background:#c94141}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function addTx(amount,type,desc){amount=Math.round(amount);S.money+=amount;
 S.tx.push({transactionId:'TX'+(++S.seq.tx),type,amount,timestamp:Date.now(),day:S.day,gameTime:Math.floor(S.time),description:desc});
 if(S.tx.length>3000)S.tx.shift()}
function recharge(c,amount){
 amount=Math.round(Number(amount));
 if(!c||!(amount>0))return{ok:false,err:'err_amount'};
 if(c.state==='LEAVING')return{ok:false,err:'err_cust'};
 if(amount>availableCash(c))return{ok:false,err:'err_wallet'};
 const before=c.balance;c.money-=amount;c.balance+=amount;
 addTx(amount,'RECHARGE',t('tx_recharge',{name:c.name}));S.today.recharge+=amount;
 if(c.rechargeReq){c.happiness=clamp(c.happiness+(amount>=c.rechargeReq?8:3),0,100);c.rechargeReq=0}
 if(c.state==='RECHARGE')c.state=c.order?'WAITING_FOOD':'PLAYING';
 if(c.askAmt)c.askAmt=Math.max(0,c.askAmt-amount);
 fx.sfx('cash');fx.float(c.x,c.y-74,'+'+vnd(amount),'#2f8a47');
 return{ok:true,before,after:c.balance}}
function buyStock(id,qty){
 const it=ITEM_BY[id];qty=Math.floor(qty);
 if(!it||!(qty>0))return{ok:false,err:'err_generic'};
 if(S.phase==='REPORT')return{ok:false,err:'err_report'};
 const cost=it.cost*qty;if(S.money<cost)return{ok:false,err:'err_money'};
 S.inv[id]+=qty;addTx(-cost,'INVENTORY_PURCHASE',t('tx_buy',{n:qty,unit:it.unit,item:itemName(id)}));S.today.purchases+=cost;
 return{ok:true,cost}}

function hasIng(R){for(const k in R.ing)if((S.inv[k]||0)<R.ing[k])return k;return null}

function startCook(st,rid){
 const R=MENU_BY[rid];if(!R||R.station!==st||!S.stations[st])return{ok:false,err:'err_generic'};
 const slots=S.stations[st],i=slots.indexOf(null);if(i<0)return{ok:false,err:'err_station_busy'};
 const miss=hasIng(R);if(miss)return{ok:false,err:'err_stock',item:itemName(miss)};
 consume(R);slots[i]={r:rid,t:0,done:false};fx.sfx(st==='fryer'?'fry':'pop');return{ok:true,i}}
function takeFridge(rid){
 const R=MENU_BY[rid];if(!R||R.station!=='fridge')return{ok:false,err:'err_generic'};
 if(S.tray.length>=CFG.TRAY_MAX)return{ok:false,err:'tray_full'};
 const miss=hasIng(R);if(miss)return{ok:false,err:'err_stock',item:itemName(miss)};
 consume(R);S.tray.push(rid);return{ok:true}}
function pickUp(st){
 const slots=S.stations[st];if(!slots)return{ok:false,err:'err_generic'};
 const i=slots.findIndex(s=>s&&s.done);if(i<0)return{ok:false,err:'err_nothing'};
 if(S.tray.length>=CFG.TRAY_MAX)return{ok:false,err:'tray_full'};
 const r=slots[i].r;S.tray.push(r);slots[i]=null;return{ok:true,r}}
function discardTray(i){if(i<0||i>=S.tray.length)return null;return S.tray.splice(i,1)[0]}
function stationTick(dt){for(const st in S.stations)for(const s of S.stations[st])if(s&&!s.done){s.t+=dt;if(s.t>=MENU_BY[s.r].time){s.done=true;fx.sfx('ding')}}}
function pendingNeeds(){
 const need={};for(const c of S.customers)if(c.order)for(const it of c.order.items)if(!it.done)need[it.r]=(need[it.r]||0)+1;
 for(const r of S.tray)if(need[r])need[r]--;
 for(const k in S.stations)for(const s of S.stations[k])if(s&&need[s.r])need[s.r]--;
 for(const r in need)if(need[r]<=0)delete need[r];return need}
function trayMatches(){for(const c of S.customers)if(c.order)for(const it of c.order.items)if(!it.done&&S.tray.includes(it.r))return c;return null}
function maybeOrder(c,force){
 const T=CT[c.type],items=[];let budget=c.money;
 const add=id=>{const p=MENU_BY[id].price;if(p<=budget){items.push(id);budget-=p;return true}return false};
 if(c.hunger>=60||force){add(Math.random()<.6?c.preferredFood:pick(T.foods));if(Math.random()<.25)add(Math.random()<.5?'cavien':'xx_chien')}
 if(c.thirst>=60||(items.length&&Math.random()<.5))add(Math.random()<.6?c.preferredDrink:pick(T.drinks));
 c.lastOrderT=S.time;if(!items.length)return false;
 c.order={id:++S.seq.order,items:items.map(r=>({r,done:false})),t:S.time};
 c.state='WAITING_FOOD';c.orderPatienceMax=Math.round(50*T.pat);c.orderPatience=c.orderPatienceMax;
 S.today.orders++;say(c,line('order'),8);fx.sfx('notify');return true}
function finishOrderIfDone(c){
 if(c.order&&c.order.items.every(i=>i.done)){c.order=null;c.lastOrderT=S.time;
  if(c.state==='WAITING_FOOD'){c.state='EATING';c.eatT=15}say(c,line('thanks'),12)}}
function deliverTo(c){
 const res={n:0,earned:0};if(!c||!c.order)return res;
 for(const it of c.order.items){if(it.done)continue;const k=S.tray.indexOf(it.r);if(k<0)continue;
  S.tray.splice(k,1);it.done=true;const R=MENU_BY[it.r];
  c.money=Math.max(0,c.money-R.price);
  addTx(R.price,R.kind==='food'?'FOOD_SALE':'DRINK_SALE',menuName(R.id)+' — '+c.name);
  S.today[R.kind]+=R.price;S.today.sold[R.id]=(S.today.sold[R.id]||0)+1;
  if(R.kind==='food')c.hunger=0;else c.thirst=0;res.n++;res.earned+=R.price}
 if(res.n){const gain=5*res.n+(c.orderPatience>c.orderPatienceMax*.5?4:0);c.happiness=clamp(c.happiness+gain,0,100);
  fx.sfx('cash');fx.float(c.x,c.y-80,'+'+vnd(res.earned),'#2f8a47');fx.float(c.x+24,c.y-58,'❤ +'+gain,'#E85D5D');finishOrderIfDone(c)}
 return res}
function failOrder(c){c.order=null;c.happiness=clamp(c.happiness-25,0,100);say(c,line('angry_food'),20);S.today.ordersFailed++;
 c.state='PLAYING';c.lastOrderT=S.time;c.hunger=Math.min(c.hunger,40);c.thirst=Math.min(c.thirst,40)}
function markOOS(cid,i){
 const c=custById(cid);if(!c||!c.order)return;const it=c.order.items[i];if(!it||it.done)return;
 c.order.items.splice(i,1);c.happiness=clamp(c.happiness-5,0,100);say(c,line('oos'),12);fx.toast(t('toast_oos',{item:menuName(it.r)}));
 if(!c.order.items.length){c.order=null;c.lastOrderT=S.time;if(c.state==='WAITING_FOOD')c.state='PLAYING'}else finishOrderIfDone(c)}

 o=o||{};const per=period(S.time);let acc=null;
 if(!o.type){const names=Object.keys(S.accounts);if(names.length&&Math.random()<.35){const n=pick(names);if(!S.customers.some(c=>c.name===n))acc=S.accounts[n]}}
 const T=o.type?CT[o.type]:acc?CT[acc.type]:wpick(CTYPES,x=>x.w[per]);
 const money=rint(T.money[0]/1000,T.money[1]/1000)*1000,balance=acc?acc.balance:0,pat=Math.round(50*T.pat);
 const c={id:++S.seq.c,name:acc?acc.name:newName(),type:T.id,look:acc?acc.look:randLook(T),money,balance,returning:!!acc,
  state:'ENTER',x:CFG.DOOR.x,y:CFG.DOOR.y,path:[],flip:false,pcId:null,patienceMax:pat,patience:pat,happiness:70,
  gamingTime:rint(T.play[0],T.play[1]),played:0,hunger:rint(0,45),thirst:rint(0,45),
  preferredPC:T.prefer,preferredFood:pick(T.foods),preferredDrink:pick(T.drinks),
  order:null,orderPatience:0,orderPatienceMax:1,lastOrderT:S.time,eatT:0,rechargeReq:0,rechargePatience:0,rechargePatienceMax:1,reqCooldown:0,
  say:null,joke:T.id==='hocsinh'&&Math.random()<.25,askAmt:0,askText:''};
 if(c.joke)c.gamingTime=Math.max(c.gamingTime,180);
 let ask=rint(T.recharge[0]/10000,T.recharge[1]/10000)*10000;if(balance>=30000)ask=0;
 c.askAmt=Math.min(ask,Math.floor(money/10000)*10000);
 c.askText=c.joke?line('joke'):line(T.prefer==='gaming'?'ask_gaming':(Math.random()<.3?'ask_cheap':'ask'));
 S.customers.push(c);S.today.visitors++;fx.sfx('bell');return c}
function maybeSpawn(dt){
 if(NOSPAWN)return;
 const q=S.customers.filter(c=>c.state==='ENTER'||c.state==='WAITING').length;
 if(q>=6||S.customers.length>=S.pcs.length+6)return;
 const p=PERIODS[period(S.time)].rate*(isWeekend(S.day)?1.3:1)*(0.6+S.rating*0.1)*dt;
 if(Math.random()<p)spawnCustomer()}
function moveTo(c,x,y,dt){const dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy),st=CFG.WALK*dt;
 if(d<=st){c.x=x;c.y=y;return true}c.x+=dx/d*st;c.y+=dy/d*st;if(Math.abs(dx)>1)c.flip=dx<0;return false}
function moveAlong(c,dt){let st=CFG.WALK*dt;
 while(st>0&&c.path.length){const p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);if(Math.abs(dx)>1)c.flip=dx<0;
  if(d<=st){c.x=p.x;c.y=p.y;c.path.shift();st-=d}else{c.x+=dx/d*st;c.y+=dy/d*st;st=0}}
 return!c.path.length}
function reqAmount(c){const T=CT[c.type];const a=rint(T.recharge[0]/10000,T.recharge[1]/10000)*10000;
 return Math.max(0,Math.min(a,Math.floor(availableCash(c)/10000)*10000))}
function rateVisit(c){if(c.rated)return;c.rated=true;const stars=clamp(1+c.happiness/25,1,5);
 S.rating=clamp(S.rating*.92+stars*.08,1,5);S.today.happySum+=c.happiness;S.today.happyN++}
function saveAccount(c){if(c.balance<1000&&!c.returning)return;const prev=S.accounts[c.name];
 S.accounts[c.name]={name:c.name,type:c.type,look:c.look,balance:Math.floor(c.balance),visits:(prev?prev.visits:0)+1};
 const keys=Object.keys(S.accounts);if(keys.length>40)delete S.accounts[keys[0]]}
function assignPC(c,pc){
 if(!c||(c.state!=='WAITING'&&c.state!=='ENTER'))return{ok:false,err:'err_cust'};
 if(!pc||pc.status!=='AVAILABLE')return{ok:false,err:'err_pc_busy'};
 if(c.balance<pc.hourlyRate/4)return{ok:false,err:'err_balance'};
 pc.status='RESERVED';pc.currentCustomer=c.id;pc.sessionTime=0;c.pcId=pc.id;c.state='TO_PC';
 const s=seatOf(pc);c.path=[{x:CFG.AISLE_X,y:c.y},{x:CFG.AISLE_X,y:s.y},{x:s.x,y:s.y}];
 const diff=PC_TIERS[pc.tier].rank-PC_TIERS[c.preferredPC].rank;
 if(diff<0){c.happiness-=(CT[c.type].strict?18:8)*-diff;say(c,line('low_tier'))}else c.happiness+=diff>0?4:6;
 if(c.patience>c.patienceMax*.6)c.happiness+=4;
 c.happiness=clamp(c.happiness,0,100);return{ok:true}}
function checkout(c){
 if(c.state==='LEAVING')return;
 const pc=c.pcId?pcById(c.pcId):null;
 if(pc&&pc.currentCustomer===c.id){pc.status='AVAILABLE';pc.currentCustomer=null;pc.sessionTime=0}
 c.order=null;c.rechargeReq=0;c.pcId=null;S.today.served++;rateVisit(c);saveAccount(c);
 c.path=[{x:CFG.AISLE_X,y:c.y},{x:CFG.AISLE_X,y:560},{x:CFG.DOOR.x,y:CFG.DOOR.y}];c.state='LEAVING';fx.sfx('pop')}
function leave(c){if(c.state==='LEAVING')return;c.state='LEAVING';c.path=[{x:CFG.DOOR.x,y:CFG.DOOR.y}];rateVisit(c);if(c.returning||c.balance>=1000)saveAccount(c)}
function sendHome(c){if(c.state==='LEAVING')return;if(c.state==='ENTER'||c.state==='WAITING')leave(c);else checkout(c)}
function seatedTick(c,dt){
 const T=CT[c.type],pc=pcById(c.pcId);if(!pc){checkout(c);return}
 const cost=pc.hourlyRate/60*dt;
 if(c.balance<cost){c.balance=0;const amt=c.rechargeReq||reqAmount(c);
  if(amt>0&&c.played<c.gamingTime){c.rechargeReq=amt;c.state='RECHARGE';c.rechargePatienceMax=Math.round(40*T.pat);
   c.rechargePatience=Math.max(c.rechargePatience,c.rechargePatienceMax);say(c,line(c.joke?'more':'recharge',{amt:vk(amt)}))}
  else{say(c,line('broke'),30);checkout(c)}return}
 c.balance-=cost;pc.revenue+=cost;pc.sessionTime+=dt;S.today.pcUsage+=cost;S.today.pcMinutes+=dt;c.played+=dt;
 c.hunger+=T.hunger*.7*dt;c.thirst+=T.thirst*.7*dt;
 if(c.state==='EATING'){c.eatT-=dt;if(c.eatT<=0)c.state='PLAYING'}
 else if(c.state==='WAITING_FOOD'){c.orderPatience-=dt;if(c.orderPatience<=0)failOrder(c)}
 else if(c.state==='PLAYING'&&!c.order&&S.phase==='OPEN'&&S.time-c.lastOrderT>=25&&(c.hunger>=60||c.thirst>=60))maybeOrder(c,false);
 if(c.rechargeReq){c.rechargePatience-=dt;if(c.rechargePatience<=0){c.rechargeReq=0;c.reqCooldown=S.time+60;c.happiness=clamp(c.happiness-10,0,100)}}
 else if(c.balance<pc.hourlyRate/60*12&&c.played<c.gamingTime-20&&S.time>=c.reqCooldown){
  const amt=reqAmount(c);
  if(amt>0){c.rechargeReq=amt;c.rechargePatienceMax=Math.round(45*T.pat);c.rechargePatience=c.rechargePatienceMax;say(c,line(c.joke?'more':'recharge',{amt:vk(amt)}));fx.sfx('notify')}
  else c.reqCooldown=S.time+60}
 if(c.played>=c.gamingTime&&c.state!=='WAITING_FOOD'){say(c,line('bye'),30);checkout(c)}}
function updCustomer(c,dt){
 switch(c.state){
  case'ENTER':case'WAITING':{const q=queueSpot(Math.min(queueIndex(c),7));const arrived=moveTo(c,q.x,q.y,dt);
   if(c.state==='ENTER'&&arrived)c.state='WAITING';
   if(c.state==='WAITING'&&SERVING!==c.id){c.patience-=dt;if(c.patience<=0){c.happiness=clamp(c.happiness-40,0,100);say(c,line('angry_wait'),30);S.today.left++;leave(c)}}
   break}
  case'TO_PC':if(moveAlong(c,dt)){const pc=pcById(c.pcId);if(pc)pc.status='OCCUPIED';c.state='PLAYING';c.lastOrderT=S.time;c.flip=false;fx.sfx('pop')}break;
  case'PLAYING':case'WAITING_FOOD':case'EATING':seatedTick(c,dt);break;
  case'RECHARGE':c.rechargePatience-=dt;if(c.rechargePatience<=0){c.happiness=clamp(c.happiness-20,0,100);say(c,line('broke'),30);checkout(c)}break;
  case'LEAVING':if(moveAlong(c,dt))c.gone=true;break}
 if(c.say&&S.time>c.say.until)c.say=null}

function openShop(){if(S.phase!=='PREP')return false;S.phase='OPEN';S.time=CFG.OPEN;fx.sfx('bell');fx.toast(t('toast_open'),'ok');
 if(!TEST&&!NOSPAWN)spawnCustomer();return true}
function stepSim(dt){
 if(S.phase!=='OPEN'&&S.phase!=='CLOSING')return;
 if(S.phase==='OPEN'){S.time=Math.min(CFG.CLOSE,S.time+dt);if(S.time<CFG.LAST_ENTRY)maybeSpawn(dt);
  if(!S.today.warned&&S.time>=1350){S.today.warned=true;fx.toast(t('toast_last'))}}
 stationTick(dt);
 for(const c of S.customers)updCustomer(c,dt);
 S.customers=S.customers.filter(c=>!c.gone);
 if(S.phase==='OPEN'&&S.time>=CFG.CLOSE){S.phase='CLOSING';for(const c of S.customers)sendHome(c);fx.toast(t('toast_closing'))}
 if(S.phase==='CLOSING'&&!S.customers.length){endDay();if(!TEST)saveGame()}}
function endDay(){
 if(S.phase==='REPORT')return S.report;
 const d=S.today,elec=CFG.ELEC_BASE+Math.round(d.pcMinutes/60*CFG.ELEC_PC_HOUR);
 addTx(-elec,'ELECTRICITY',t('exp_elec'));addTx(-CFG.INTERNET,'INTERNET',t('exp_net'));addTx(-CFG.MAINT,'REPAIR',t('exp_maint'));
 const rev={recharge:d.recharge,food:d.food,drink:d.drink},revenue=d.recharge+d.food+d.drink;
 const exp={purchases:d.purchases,elec,internet:CFG.INTERNET,maint:CFG.MAINT},expense=exp.purchases+elec+exp.internet+exp.maint;
 S.report={day:S.day,rev,revenue,exp,expense,profit:revenue-expense,pcUsage:Math.round(d.pcUsage),pcHours:d.pcMinutes/60,
  visitors:d.visitors,served:d.served,left:d.left,orders:d.orders,failed:d.ordersFailed,sat:d.happyN?Math.round(d.happySum/d.happyN):0,sold:{...d.sold}};
 S.history.push({day:S.day,revenue,expense,profit:revenue-expense});if(S.history.length>60)S.history.shift();
 S.phase='REPORT';S.stations={stove:[null,null],fryer:[null,null],bar:[null]};S.tray=[];return S.report}
function nextDay(){
 if(S.phase!=='REPORT')return false;if(S.day===1)S.tutorialDone=true;
 S.day++;S.time=CFG.OPEN-30;S.phase='PREP';S.today=freshToday(S.money);S.tx=[];S.report=null;S.customers=[];
 S.pcs.forEach(p=>{p.status='AVAILABLE';p.currentCustomer=null;p.sessionTime=0});return true}
function forecast(){
 const m=(0.6+S.rating*0.1)*(isWeekend(S.day)?1.3:1);const base=PERIODS.reduce((a,p,i)=>a+p.rate*(i===4?60:p.min),0)*m;
 const lo=Math.round(base*.85),hi=Math.round(base*1.15);const r=(a,b)=>[Math.round(lo*a),Math.round(hi*b)];
 return{cust:[lo,hi],noodle:r(.35,.5),fried:r(.15,.3),drink:r(.5,.75)}}

function botTick(){
 const cash=c=>Math.floor(availableCash(c)/10000)*10000;
 for(const c of S.customers){
  if(c.state==='WAITING'){const free=S.pcs.filter(p=>p.status==='AVAILABLE');
   if(free.length){const pc=free.find(p=>p.tier===c.preferredPC)||free[0];
    if(c.balance<pc.hourlyRate/4){const a=Math.min(Math.max(c.askAmt,10000),cash(c));if(a>0)recharge(c,a)}assignPC(c,pc)}}
  else if(c.state!=='LEAVING'&&(c.rechargeReq||c.state==='RECHARGE')){const a=Math.min(c.rechargeReq||10000,cash(c));if(a>0)recharge(c,a)}}
 const want={};for(const c of S.customers)if(c.order)for(const it of c.order.items)if(!it.done)want[it.r]=(want[it.r]||0)+1;
 S.tray=S.tray.filter(r=>{if(want[r]>0){want[r]--;return true}return false});
 for(const st of['stove','fryer','bar'])while(S.tray.length<CFG.TRAY_MAX&&pickUp(st).ok);
 for(const c of S.customers)if(c.order)deliverTo(c);
 const need=pendingNeeds();
 for(const r in need){const R=MENU_BY[r];for(let k=0;k<need[r];k++){if(R.station==='fridge'){if(!takeFridge(r).ok)break}else if(!startCook(R.station,r).ok)break}}
 for(const c of S.customers)if(c.order)deliverTo(c);
 for(const it of ITEMS)if(S.inv[it.id]<it.min)buyStock(it.id,it.pack*2)}
function checkInv(errs){
 const push=m=>{if(errs.length<10&&!errs.includes(m))errs.push(m)};
 for(const pc of S.pcs)if(pc.status!=='AVAILABLE'){const c=custById(pc.currentCustomer);if(!c||c.pcId!==pc.id)push('PC #'+pc.id+' giữ sai khách')}
 const used=S.customers.filter(c=>c.pcId).map(c=>c.pcId);if(new Set(used).size!==used.length)push('Hai khách cùng một máy');
 for(const k in S.inv)if(S.inv[k]<0)push('Kho âm: '+k);
 if(S.tray.length>CFG.TRAY_MAX)push('Tay cầm quá số món');
 if(!Number.isInteger(S.money))push('Tiền bị lẻ')}
function simulateFullDay(){
 S=newState();NOSPAWN=false;openShop();const errs=[];let g=0;
 while(S.phase!=='REPORT'&&g++<4000){botTick();stepSim(1);checkInv(errs)}
 const sum=S.tx.reduce((a,x)=>a+x.amount,0),r=S.report||{};
 return{done:S.phase==='REPORT',errs,ledger:S.money===S.today.startMoney+sum,
  reportOk:!!S.report&&r.profit===r.revenue-r.expense&&r.revenue===r.rev.recharge+r.rev.food+r.rev.drink,
  served:r.served||0,revenue:r.revenue||0,
  info:S.report?`Khách ${r.visitors} · ngồi máy ${r.served} · bỏ về ${r.left} · doanh thu ${vnd(r.revenue)} · lợi nhuận ${vnd(r.profit)}`:'Không kết thúc được ngày'}}

function walkTo(x,y,cb){UI.walk={x,y,cb}}

function doAssign(c,pc){if(!c||!pc)return;const r=assignPC(c,pc);if(!r.ok){fx.err(r.err);return}

function interactSeated(id){const c=custById(id);if(!c||!isSeated(c))return;

function interactStation(id){
 if(id==='fridge'){openSheet('station','fridge');return}
 const slots=S.stations[id];
 if(slots.some(s=>s&&s.done)){const r=pickUp(id);if(r.ok){fx.toast(t('toast_pick',{item:menuName(r.r)}),'ok');fx.sfx('pop')}else fx.err(r.err);return}

function onWorld(e){
 const el=e.target.closest('[data-act]');
 if(UI.sheet&&UI.sheet.kind==='counter'&&el&&el.dataset.act==='pc'){const pc=pcById(+el.dataset.id),c=custById(UI.sheet.id);if(pc&&c&&pc.status==='AVAILABLE'){doAssign(c,pc);return}}
 if(!el||S.phase==='REPORT')return;
 if(UI.sheet&&UI.sheet.kind==='counter')closeSheet();
 const act=el.dataset.act,id=el.dataset.id;
 if(act==='pc'){openSheet('pc',+id);return}
 if(act==='cust'){const c=custById(+id);if(!c)return;
  if(c.state==='ENTER'||c.state==='WAITING')walkTo(CFG.COUNTER_SPOT.x,CFG.COUNTER_SPOT.y,()=>{const cc=custById(c.id);if(cc&&(cc.state==='ENTER'||cc.state==='WAITING'))openSheet('counter',c.id)});
  else if(isSeated(c)){const s=seatOf(pcById(c.pcId));walkTo(s.x+36,s.y-2,()=>interactSeated(c.id))}
  return}
 if(act==='counter'){walkTo(CFG.COUNTER_SPOT.x,CFG.COUNTER_SPOT.y,()=>{const c=S.customers.find(x=>x.state==='WAITING');if(c)openSheet('counter',c.id);else fx.toast(t('no_queue'))});return}
 if(act==='st'){const s=STATIONS[id];
  if(id==='storage'){walkTo(s.spot[0],s.spot[1],()=>openSheet('inv'));return}
  if(S.phase!=='OPEN'&&S.phase!=='CLOSING'){fx.err('err_closed');return}
  walkTo(s.spot[0],s.spot[1],()=>interactStation(id))}}

 cook:a=>{const st=UI.sheet.id,r=startCook(st,a);if(!r.ok){fx.err(r.err,{item:r.item,st:t('st_'+st)});return}fx.toast(t('toast_cook',{item:menuName(a)}));closeSheet()},
 take:a=>{const r=takeFridge(a);if(!r.ok){fx.err(r.err,{item:r.item});return}fx.sfx('pop');fx.toast(t('toast_take',{item:menuName(a)}),'ok');renderSheet()},
 buy:a=>{const[id,q]=a.split('|'),r=buyStock(id,+q);if(!r.ok){fx.err(r.err);return}fx.sfx('cash');fx.toast(t('toast_bought',{n:q,item:itemName(id)}),'ok');saveGame();renderSheet()},
 oos:a=>{const[cid,i]=a.split('|');markOOS(+cid,+i);renderSheet()},
 open:()=>{if(openShop()){closeSheet();saveGame()}},
 next:()=>{if(nextDay()){UI.prepShown=false;UI.lastRc=null;closeSheet(true);saveGame()}},
 inv:()=>openSheet('inv'),viewCust:a=>openSheet('cust',+a),openPc:a=>openSheet('pc',+a),start:()=>openSheet('prep'),
 sound:()=>{S.settings.sound=!S.settings.sound;renderSheet()},
 save:()=>{saveGame();fx.toast(t('toast_saved'),'ok')},
 test:()=>{UI.testRes=runTests();openSheet('tests')},
 reset:()=>{if(confirm(t('reset_confirm'))){UI.noSave=true;try{localStorage.removeItem(CFG.KEY)}catch(e){}location.reload()}}};

/* ================= LOOP + INIT ================= */
let last=0;
function frame(now){
 const dt=Math.min(.1,(now-last)/1000||0);last=now;
 if(!S.paused&&(S.phase==='OPEN'||S.phase==='CLOSING')){let m=dt*CFG.MIN_PER_SEC*S.speed;while(m>1e-6){const d=Math.min(1,m);stepSim(d);m-=d}}
 movePlayer(dt);renderTop();renderPCs();renderStations();renderCustomers();renderPlayer();renderTray();
 if(now-UI.hintT>400){UI.hintT=now;setT($('hintTx'),hintText())}
 if(UI.sheet&&now-UI.refreshT>1000){UI.refreshT=now;if(['counter','cust','pc','pcs','orders','station'].includes(UI.sheet.kind))renderSheet()}
 if(S.phase==='REPORT'&&(!UI.sheet||UI.sheet.kind!=='report'))openSheet('report');
 if(S.phase==='PREP'&&!UI.sheet&&!UI.prepShown){UI.prepShown=true;openSheet('prep')}
 requestAnimationFrame(frame)}
function bind(){
 $('world').addEventListener('click',onWorld);
 $('world').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act){e.preventDefault();onWorld(e)}});
 $('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-ui]');if(b&&ACT[b.dataset.ui])ACT[b.dataset.ui](b.dataset.a,b)});
 $('sheetBg').addEventListener('click',()=>closeSheet());
 $('trayItems').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const r=discardTray(+b.dataset.i);if(r)fx.toast(t('toast_discard',{item:menuName(r)}))});
 $('speeds').addEventListener('click',e=>{const b=e.target.closest('[data-sp]');if(!b)return;const v=+b.dataset.sp;if(v===0)S.paused=!S.paused;else{S.speed=v;S.paused=false}});
 $('bStatus').addEventListener('click',()=>{if(S.phase==='PREP')ACT.open();else if(S.phase==='REPORT')openSheet('report')});
 $('bar').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b&&S.phase!=='REPORT')openSheet(b.dataset.nav)});
 document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape')closeSheet();
  else if(e.key===' '&&!(e.target.dataset&&e.target.dataset.act)&&e.target.tagName!=='BUTTON'){e.preventDefault();S.paused=!S.paused}
  else if(e.key==='1'||e.key==='2'||e.key==='4'){S.speed=+e.key;S.paused=false}});
 window.addEventListener('resize',fit);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
 window.addEventListener('beforeunload',saveGame);
 setInterval(saveGame,CFG.AUTOSAVE);
 $('nPc').textContent=t('nav_pc');$('nFood').textContent=t('nav_food');$('nInv').textContent=t('nav_inv');$('nRev').textContent=t('nav_rev');$('nSet').textContent=t('nav_set');
 $('trayLbl').textContent=t('tray');$('hintAv').innerHTML=charSVG(GUIDE_LOOK,{mood:2,s:.75})}
function init(){
 S=loadGame();const fresh=!S;if(!S)S=newState();
 bind();buildWorld();fit();requestAnimationFrame(fit);
 if(fresh){UI.prepShown=true;openSheet('welcome')}
 if(/[?&]test\b/.test(location.search)){UI.testRes=runTests();openSheet('tests')}
 requestAnimationFrame(n=>{last=n;frame(n)})}
init();
</script>
</body>
</html>
