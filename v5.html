<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFB84D">
<title>Tiệm Net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--pri:#FFB84D;--sec:#FF7A59;--acc:#5CC8A1;--bg:#FFF7EA;--dark:#303030;--ok:#58B368;--warn:#F2B84B;--bad:#E85D5D;--blue:#5B9DEF;--muted:#7a6f63;--line:#efdcc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--dark);font-family:Nunito,system-ui,sans-serif;font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--dark);background:#fff;border-radius:12px;min-height:44px;padding:4px 12px;line-height:1.2}
button:active{transform:scale(.96)}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.pri{background:var(--pri)} button.ok{background:var(--acc)} button.danger{background:#FDE5E5} button.go{background:var(--ok);color:#fff}
button.sm{min-height:36px;font-size:13px;padding:2px 8px;border-radius:10px}
#app{display:flex;flex-direction:column;height:100%}
/* ---- thanh trên: luôn 1 hàng ---- */
#top{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;padding:6px 8px;background:#fff;border-bottom:2px solid var(--dark);overflow:hidden}
.chip{padding:4px 8px;border-radius:999px;background:var(--bg);border:2px solid var(--dark);font-size:13px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#bStatus{flex:none;min-height:32px;padding:2px 10px;border-radius:999px;font-weight:900;font-size:12px;white-space:nowrap}
#bStatus.prep{background:var(--pri);animation:pulse 1s infinite alternate}
#bStatus.open{background:var(--ok);color:#fff} #bStatus.closing{background:var(--warn)} #bStatus.report{background:#eee}
@keyframes pulse{to{transform:scale(1.06)}}
#bPause{margin-left:auto;flex:none;min-height:36px;min-width:42px;padding:0 6px;font-size:15px;border-radius:10px}
#bPause.on{background:var(--dark);color:#fff}
@media(min-width:700px){.chip{font-size:14px;padding:5px 10px}#bStatus{font-size:13px}}
/* ---- bản đồ ---- */
#vp{flex:1;overflow:auto;position:relative}
#wrap{position:relative;margin:0 auto}
#world{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0;overflow:hidden;border-radius:0 0 18px 18px;
 background:linear-gradient(#F3D3A4 0 28px,#8a6a4a 28px 31px,transparent 31px),repeating-conic-gradient(#FBE8C8 0 25%,#F6DDB6 0 50%) 0 0/48px 48px}
.ent{position:absolute;left:0;top:0}
[data-act]{cursor:pointer}
[data-act]:hover svg{filter:drop-shadow(0 0 3px #FFB84D) drop-shadow(0 0 2px #FFB84D)}
.kfloor{left:10px;top:31px;width:940px;height:150px;background:repeating-linear-gradient(90deg,#eef2ee 0 24px,#e3e9e4 24px 48px);border-radius:0 0 14px 14px;z-index:1}
.pcrug{left:312px;top:186px;width:576px;height:340px;background:rgba(91,157,239,.07);border:2px dashed rgba(91,157,239,.35);border-radius:22px;z-index:1}
.qlane{border:2px dashed rgba(48,48,48,.28);background:rgba(255,184,77,.12);border-radius:12px;z-index:1}
.lbl,.zone{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:999px;font-size:11px;font-weight:900;padding:0 8px;white-space:nowrap;pointer-events:none}
.zone{transform:none;left:auto;bottom:auto;z-index:5}
.wallmenu{left:600px;top:7px;z-index:3;font-size:11px;font-weight:900;color:#5a3a22;white-space:nowrap}
/* máy */
.pc .desk,.pc .chair,.pc .tag{position:absolute;left:0}
.pc .chair{top:60px}
.pc .tag{top:108px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff;border:2px solid var(--dark);border-radius:8px;padding:0 6px;text-align:center;white-space:nowrap;line-height:1.25;pointer-events:none}
.pc .scr{fill:#3d4454;transition:fill .3s} .pc .game{display:none}
.pc[data-s="OCCUPIED"] .scr{fill:#27406e} .pc[data-s="OCCUPIED"] .game{display:inline;animation:blink 1.2s infinite}
.pc[data-s="RESERVED"] .scr{fill:#F2B84B}
.pc[data-s="AVAILABLE"] .pst{color:#2f8a47} .pc[data-s="OCCUPIED"] .pst{color:#2f63b5} .pc[data-s="RESERVED"] .pst{color:#a86b00}
.pc.pick .desk{animation:pick .7s infinite alternate}
@keyframes pick{to{filter:drop-shadow(0 0 8px #5CC8A1) drop-shadow(0 0 3px #5CC8A1)}}
@keyframes blink{50%{opacity:.5}}
/* nhân vật */
.cust,.player{width:40px;height:56px}
.player{pointer-events:none}
.spr{width:40px;height:56px;transform-origin:50% 100%}
.walking .spr{animation:bob .25s infinite alternate}
@keyframes bob{to{translate:0 -2px}}
.bub{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:12px;padding:3px 8px;font-size:12px;white-space:nowrap;line-height:1.3;display:none;text-align:center;font-weight:800}
.bub.on{display:block} .bub.order.on{display:flex;gap:3px;align-items:center;padding:3px 5px;border-color:var(--sec);border-width:2.5px}
.bub.money{background:#FFF3C4}
.bub:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--dark);border-bottom:0}
.bub .oi{position:relative;line-height:0}
.bub .oi.rd:after{content:'✓';position:absolute;right:-4px;top:-6px;background:var(--ok);color:#fff;border-radius:50%;font-size:10px;line-height:14px;width:14px;text-align:center}
.bub .oi.wip{opacity:.75}
.bub .md{font-size:14px;line-height:1}
.pat{position:absolute;bottom:-9px;left:4px;width:32px;height:6px;background:#eee;border:1.5px solid var(--dark);border-radius:4px;overflow:hidden;display:none}
.pat i{display:block;height:100%}
.qn{position:absolute;top:-2px;left:-10px;background:#fff;border:2px solid var(--dark);border-radius:999px;font-size:11px;font-weight:900;padding:0 5px;display:none}
.cust .ring{display:none;position:absolute;left:-7px;bottom:-9px;width:54px;height:18px;border:3px solid var(--ok);border-radius:50%}
.cust .arr{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:72px;font-size:20px;color:var(--ok);text-shadow:0 0 3px #fff}
.cust.nvc .ring{display:block;animation:ringp .6s infinite alternate}
.cust.nvc .arr{display:block;animation:arrb .45s infinite alternate}
@keyframes ringp{to{transform:scale(1.15)}}
@keyframes arrb{to{bottom:80px}}
.ptag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--pri);border:2px solid var(--dark);border-radius:999px;padding:0 6px;font-weight:900;white-space:nowrap}
.staffch .ptag{background:var(--acc)}
.player .hand{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:#fff;border:2px solid var(--dark);border-radius:10px;padding:1px;line-height:0;display:none}
.float{position:absolute;width:140px;margin-left:-70px;text-align:center;font-weight:900;font-size:17px;pointer-events:none;z-index:3000;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff,0 -1px 0 #fff}
@keyframes up{to{transform:translateY(-44px);opacity:0}}
/* trạm bếp */
.ks{position:absolute;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ks.empty{border:2px dashed rgba(48,48,48,.28)}
.ks.sel{outline:3px solid var(--blue);outline-offset:1px}
.ks.warn{animation:kw .35s infinite alternate}
@keyframes kw{to{transform:scale(1.08)}}
.ks.shaking svg{animation:shk .18s infinite alternate}
@keyframes shk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.ks .tb{position:absolute;left:-7px;right:-7px;bottom:-17px;height:13px;background:#cfcfcf;border:2px solid #303030;border-radius:6px;overflow:hidden}
.ks .tb i,.kpb i{position:absolute;top:0;bottom:0}
.zp{background:#58B368} .zo{background:#F2B84B} .zb{background:var(--blue)}
.ks .tb b,.kpb b{position:absolute;top:0;bottom:0;width:4px;background:#303030;margin-left:-2px}
.ks .bd{position:absolute;top:-8px;right:-8px;font-size:11px;background:#fff;border:1.5px solid #303030;border-radius:999px;padding:0 4px;line-height:1.4}
.ks .bd.ok{background:#DDF3E3}
.ks .pt{position:absolute;top:-9px;left:-8px;font-size:10px;font-weight:900;background:var(--dark);color:#fff;border-radius:999px;padding:0 4px;line-height:1.5;white-space:nowrap}
.ks .need{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#E6F1FB;border:1.5px solid var(--blue);border-radius:999px;padding:0 4px;white-space:nowrap;z-index:2}
.kbn{position:absolute;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);border:1.5px solid #303030;border-radius:7px;cursor:pointer}
.kbn.out{opacity:.35}
.nv{outline:3px dashed #E8A21B;outline-offset:4px;border-radius:12px;animation:nvp .7s infinite alternate}
@keyframes nvp{to{outline-offset:9px}}
.nvb{border-color:var(--blue)!important;background:#E6F1FB!important;animation:nvb .5s infinite alternate}
@keyframes nvb{to{transform:scale(1.12)}}
.teach .nv{outline:5px solid #E85D5D;animation-duration:.4s}
.teach .kbn.nvb{transform:scale(1.2)}
.autob{position:absolute;top:-9px;left:6px;background:var(--acc);color:#fff;font-size:11px;font-weight:900;border:2px solid var(--dark);border-radius:999px;padding:0 6px;pointer-events:none}
.lockst{filter:grayscale(1) opacity(.5);pointer-events:none}
.lockb{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#303030;color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;white-space:nowrap;z-index:6;display:none}
.lockst .lockb{display:block}
.nopu [data-act="kst"][data-id="pickup"]{display:none}
.puslot{position:absolute;width:44px;height:44px;border-radius:10px;border:2px dashed rgba(48,48,48,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.5)}
.puslot.full{border:2px solid var(--dark);background:#fff}
.puslot .pt{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:var(--ok);color:#fff;border-radius:999px;padding:0 5px;line-height:1.5;white-space:nowrap}
.puslot .pt.none{background:#999}
/* ---- thanh dưới + khay ---- */
#bar{display:flex;justify-content:space-around;padding:4px;background:#fff;border-top:2px solid var(--dark);padding-bottom:calc(4px + env(safe-area-inset-bottom))}
#bar button{border:none;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:0;flex:1;background:none;padding:2px}
#bar button span:first-child{font-size:20px}
#carry{position:fixed;left:10px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:2px solid var(--dark);border-radius:14px;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;max-width:calc(100% - 20px);overflow-x:auto}
#carry.has{background:#FFF0D6}
#carry button{position:relative;min-height:44px;min-width:44px;padding:2px;border-radius:10px;flex:none}
#carry button.confirm{background:#FDE5E5;border-color:var(--bad)}
#carry .q{position:absolute;top:-7px;right:-7px;font-style:normal;font-size:11px;background:var(--warn);border-radius:999px;padding:0 4px;border:1px solid #303030}
#carry .to{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;background:var(--ok);color:#fff;border-radius:999px;padding:0 4px;white-space:nowrap}
#carry .sep{width:2px;align-self:stretch;background:var(--line);margin:0 2px;flex:none}
body.kb #carry{display:none}
/* ---- bàn thao tác ---- */
#kbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:42;background:#fff;border-top:2px solid var(--dark);display:none;flex-direction:column;gap:4px;padding:6px 8px}
.kneed{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.kbs{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 4px 10px}
.kbs button{position:relative;flex:none;min-width:68px;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:3px 6px;border-radius:10px}
.kbs button small{font-size:11px;color:var(--muted)}
.kbs button.sel{background:#E6F1FB;border-color:var(--blue)}
.kbs button.out{opacity:.4}
.kbw{position:relative;flex:none;display:flex}
.kbw .mini{position:absolute;top:-8px;right:-8px;min-width:0;min-height:0;width:26px;height:26px;padding:0;border-radius:50%;font-size:11px;background:#FDE5E5}
.slotnum{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border:2px dashed #bbb;border-radius:8px;color:var(--muted)}
.kpb{position:relative;width:74px;height:11px;background:#cfcfcf;border:1.5px solid #303030;border-radius:5px;overflow:hidden;margin-top:3px}
.kbs .qty,.kbs .minus{position:absolute;top:-9px;min-width:30px;padding:0 7px;font-size:12px;font-weight:900;font-style:normal;line-height:1.2;text-align:center;border:2px solid var(--dark);border-radius:999px;color:#fff;z-index:3}
.kbs .qty{right:-6px;background:var(--blue)}
.kbs .minus{left:-6px;background:var(--bad);cursor:pointer}
.kbs .minus::before{content:'';position:absolute;inset:-10px}
.knext{display:flex;padding:4px 2px 2px}
.knext .tg{display:inline-block;max-width:100%;padding:4px 12px;font-size:13px;line-height:1.4;font-weight:900;background:#E5F6EC;border:2px solid var(--ok);color:#2f8a47;border-radius:999px}
.knext .tg b{color:#1f6b33}
.knext .tg.btn{cursor:pointer;padding:8px 14px;border-width:2.5px;background:#D4F0DC}
/* ---- bảng (sheet) ---- */
#sheetBg{position:fixed;inset:0;background:rgba(48,48,48,.35);display:none;z-index:50}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:78vh;overflow:auto;background:#fff;border:2px solid var(--dark);border-bottom:none;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:51;display:none;animation:sh .2s}
@keyframes sh{from{transform:translate(-50%,30px);opacity:0}}
#sheet h2,#sheet h3{margin:0 0 8px;font-weight:900} #sheet h4{margin:14px 0 6px;font-weight:900}
.x{float:right;min-height:40px;width:40px;padding:0;border-radius:50%;margin-left:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative}
.grid small,.item small{font-size:11px;color:var(--muted);display:block}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1.5px solid var(--dark);white-space:nowrap}
.badge.warn{background:#FFE9B3} .badge.ok{background:#DDF3E3} .badge.acc{background:#D8F3EA} .badge.bad{background:#FDE5E5} .badge.wip{background:#E6F1FB}
.muted{color:var(--muted);font-size:13px}
.say{font-size:16px;font-weight:900;background:var(--bg);border-radius:12px;padding:8px 12px;margin:8px 0}
.eq{background:#E5F6EC;border-radius:10px;padding:6px 10px;margin:6px 0;font-size:14px}
.head{display:flex;align-items:center;gap:10px}
.item,.oitem{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item button{display:flex;flex-direction:column;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:12px} .stat b{font-size:18px}
.card{border:2px solid var(--dark);border-radius:14px;padding:8px 12px;margin:8px 0}
.ndcard{background:#FFF0D6;border-color:var(--pri)}
.ndcard ol{margin:4px 0 6px 20px;padding:0;font-size:14px;line-height:1.5}
.ndic{display:flex;gap:4px;margin:4px 0;flex-wrap:wrap}
.total{border-bottom:none;font-weight:900}
.profit .big{font-size:28px;font-weight:900} .profit.pos{background:#E5F6EC} .profit.neg{background:#FDE5E5}
.okc{color:#2f8a47} .badc{color:#c94141} .warnc{color:#a86b00}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap} .btns button{flex:1} .btns.col{flex-direction:column}
.wide{width:100%;margin-top:12px}
.empty{text-align:center;padding:16px;color:var(--muted)}
.barrow{display:grid;grid-template-columns:1.2fr 2fr 34px;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--pri)}
.log{display:grid;grid-template-columns:44px 96px 1fr;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--dark);border-radius:999px;padding:1px 8px 1px 3px;font-size:12px;margin:2px}
.pill.done{text-decoration:line-through;color:var(--muted)}
.mrow{display:grid;grid-template-columns:24px 1fr 52px 96px;align-items:center;gap:6px;font-size:14px;padding:3px 0}
.trow{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px} .trow small{display:block}
.prow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.prow .pv{min-width:48px;text-align:center} .prow small{display:block}
.scard{border:2px solid var(--dark);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.scard.on{background:#E5F6EC}
.center{text-align:center}
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--dark);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;animation:sh .2s;text-align:center}
.toast.ok{background:#2f8a47} .toast.bad{background:#c94141}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <span class="chip" id="cDay"></span><span class="chip" id="cMoney"></span><span class="chip" id="cRate"></span>
  <button id="bStatus"></button>
  <button id="bPause" aria-label="Tạm dừng">⏸</button>
 </div>
 <div id="vp"><div id="wrap"><div id="world" role="application" aria-label="Bản đồ tiệm net"></div></div></div>
 <nav id="bar">
  <button data-nav="pcs"><span>🖥</span><span data-t="nav_pc"></span></button>
  <button data-nav="orders"><span>🍜</span><span data-t="nav_food"></span></button>
  <button data-nav="inv"><span>📦</span><span data-t="nav_inv"></span></button>
  <button data-nav="rev"><span>💰</span><span data-t="nav_rev"></span></button>
  <button data-nav="staff"><span>👥</span><span data-t="nav_staff"></span></button>
  <button data-nav="upg"><span>🔧</span><span data-t="nav_upg"></span></button>
  <button data-nav="set"><span>⚙️</span><span data-t="nav_set"></span></button>
 </nav>
</div>
<div id="carry"></div>
<div id="kbar"></div>
<div id="sheetBg"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
 TIỆM NET v5 — bản sạch, 1 file. Đọc HANDOFF.md trước khi sửa.
 PHẦN: 1 Config+Data+Utils · 2 Text · 3 State+Save+Economy · 4 Customers+Day
       5 Kitchen+Matching+Delivery+Staff AI · 6 Art+World · 7 Render
       8 Input+Sheets+Loop · 9 Tests+init()
 QUY ƯỚC
 - Mỗi hàm chỉ có MỘT bản. Không ghi đè, không vá chồng.
 - Logic không đụng DOM. Hiệu ứng UI đi qua fx.* (tắt khi TEST=true). Lớp/ẩn-hiện DOM làm trong render.
 - Hàm logic trả {ok:true,step} | {ok:false,err,v}; err = key trong STR.
 - Tiền chỉ thay đổi qua addTx(amount,type,desc).
 STATE S (save v3 — giữ tương thích với v4)
  phase PREP|OPEN|CLOSING|REPORT · day · time(phút game) · money · rating · paused
  pcs[] · inv{} · lots{id:[{n,exp}]} · prices{} · upg{} · staff{type,hand,t,st,serving}|null

  g.gain.setValueAtTime(.07,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+d);o.connect(g).connect(C.destination);o.start(tt);o.stop(tt+d+.02);tt+=d}}catch(e){}}};

 S.tx.push({transactionId:'TX'+(++S.seq.tx),type,amount,timestamp:Date.now(),day:S.day,gameTime:Math.floor(S.time),description:desc});
 if(S.tx.length>3000)S.tx.shift()}
function priceOf(r){const R=MENU_BY[r];if(!R)return 0;const p=S&&S.prices?S.prices[R.id]:null;return p!=null?p:R.price}
function itemPrice(it){return priceOf(it.r)+(it.top||[]).reduce((s,x)=>s+(TOPPINGS[x]?TOPPINGS[x].price:0),0)}
function setPrice(r,p){const R=MENU_BY[r];if(!R)return KE('err_generic');if(S.phase==='REPORT')return KE('err_report');
 p=Math.round(p/1000)*1000;const lo=Math.max(1000,Math.round(R.price*.5/1000)*1000),hi=R.price*2;
 if(p<lo||p>hi)return KE('err_price_range',{lo:vk(lo),hi:vk(hi)});if(p===R.price)delete S.prices[R.id];else S.prices[R.id]=p;return KO('PRICE')}
function recipeCost(r){const R=MENU_BY[r],c=id=>ITEM_BY[id]?ITEM_BY[id].cost:0;if(!R)return 0;
 if(R.type==='noodle')return c(R.base)+c('to');if(R.type==='fried')return c(R.base)+c('dia')+c('tuong');
 if(R.type==='mix'){const m=MIX[R.id];return c(m.base)+c(m.flavor)+c('ly')}return c(R.base)}
function dishLabel(it){return menuName(it.r)+((it.top&&it.top.length)?' + '+it.top.map(x=>t('top_'+x)).join(', '):'')}
function cashFree(c){return c.money-(c.order?c.order.items.filter(i=>!i.done).reduce((a,i)=>a+itemPrice(i),0):0)}
function recharge(c,amount){
 amount=Math.round(Number(amount));if(!c||!(amount>0))return KE('err_amount');
 if(c.state==='LEAVING')return KE('err_cust');if(amount>cashFree(c))return KE('err_wallet');
 const before=c.balance;c.money-=amount;c.balance+=amount;addTx(amount,'RECHARGE',t('tx_recharge',{name:c.name}));S.today.recharge+=amount;
 if(c.rechargeReq){c.happiness=clamp(c.happiness+(amount>=c.rechargeReq?8:3),0,100);c.rechargeReq=0}
 if(c.state==='RECHARGE')c.state=c.order?'WAITING_FOOD':'PLAYING';if(c.askAmt)c.askAmt=Math.max(0,c.askAmt-amount);
 fx.sfx('cash');fx.float(c.x,c.y-74,'+'+vnd(amount),'#2f8a47');return{ok:true,step:'RECHARGE',before,after:c.balance}}

/* ---------- kho + lô hàng + hạn dùng ---------- */
function syncLots(id){if(!SHELF[id])return;S.lots=S.lots||{};const L=S.lots[id]=(S.lots[id]||[]).filter(l=>l.n>0);
 let sum=L.reduce((a,l)=>a+l.n,0);const inv=S.inv[id]||0;L.sort((a,b)=>a.exp-b.exp);
 if(sum<inv)L.push({n:inv-sum,exp:S.day+SHELF[id]});
 while(sum>inv&&L.length){const l=L[0],d=Math.min(l.n,sum-inv);l.n-=d;sum-=d;if(!l.n)L.shift()}
 L.sort((a,b)=>a.exp-b.exp)}
function takeStock(id){if((S.inv[id]||0)<=0)return null;syncLots(id);S.inv[id]--;let exp=null;
 if(SHELF[id]){const L=S.lots[id];if(L.length){L[0].n--;exp=L[0].exp;if(!L[0].n)L.shift()}}return{exp}}
function returnStock(id,exp){if(SHELF[id])syncLots(id);S.inv[id]=(S.inv[id]||0)+1;
 if(SHELF[id]){S.lots[id].push({n:1,exp:exp!=null?exp:S.day+SHELF[id]});S.lots[id].sort((a,b)=>a.exp-b.exp)}}
function expireLots(){const out={};for(const id in SHELF){syncLots(id);const L=S.lots[id];let n=0;
 while(L.length&&L[0].exp<S.day){n+=L[0].n;L.shift()}if(n){S.inv[id]-=n;out[id]=n}}S.today.expired=out;return out}
function buyStock(id,qty){
 const it=ITEM_BY[id];qty=Math.floor(qty);if(!it||!(qty>0))return KE('err_generic');if(S.phase==='REPORT')return KE('err_report');
 const cost=it.cost*qty;if(S.money<cost)return KE('err_money');
 if(SHELF[id])syncLots(id);S.inv[id]+=qty;
 if(SHELF[id]){S.lots[id].push({n:qty,exp:S.day+SHELF[id]});S.lots[id].sort((a,b)=>a.exp-b.exp)}
 addTx(-cost,'INVENTORY_PURCHASE',t('tx_buy',{n:qty,unit:it.unit,item:itemName(id)}));S.today.purchases+=cost;return{ok:true,step:'BUY',cost}}
function hasStockFor(r){const R=MENU_BY[r],h=id=>(S.inv[id]||0)>0;if(!R)return false;
 if(R.type==='noodle')return h(R.base)&&h('to');if(R.type==='fried')return h(R.base)&&h('dia')&&h('tuong');
 if(R.type==='mix'){const m=MIX[R.id];return h('ly')&&h(m.base)&&h(m.flavor)}return h(R.id)}
/* Trả 1 chai về Tủ lạnh: ưu tiên chai chưa có khách nhận */
function returnBottle(id){
 const idx=S.carry.map((d,i)=>d.r===id?i:-1).filter(i=>i>=0);if(!idx.length)return KE('err_nothing_return');
 const m=refreshMatch();let k=idx.find(i=>!m.byObj.get(S.carry[i]));if(k==null)k=idx[idx.length-1];
 S.carry.splice(k,1);returnStock(id,null);refreshMatch();return KO('RETURN')}

/* ---------- nhân viên + nâng cấp ---------- */
function hireStaff(ty){const D=STAFF[ty];if(!D)return KE('err_generic');if(S.phase==='REPORT')return KE('err_report');
 if(S.staff)return KE('err_staff_one');if(S.money<D.hire)return KE('err_money');
 addTx(-D.hire,'STAFF_HIRE',t('tx_hire',{name:t('staff_'+ty)}));S.today.hire=(S.today.hire||0)+D.hire;
 S.staff={type:ty,hand:null,t:0,st:null,busy:0};S.today.staffDays=S.today.staffDays||{};S.today.staffDays[ty]=true;return KO('HIRE')}
function fireStaff(){if(!S.staff)return KE('err_generic');
 if(S.staff.type==='cashier')for(const c of S.customers)if(c.state==='SERVING'&&c.id!==SERVING)c.state='QUEUE';
 S.staff=null;UI.sx=UI.sy=null;return KO('FIRE')}
function buyUpgrade(id){const U=UPG_BY[id];if(!U)return KE('err_generic');if(S.upg[id])return KE('err_upg_owned');
 if(U.req==='cook'&&!hasCook())return KE('err_need_cook');
 if(S.phase==='REPORT')return KE('err_report');if(S.money<U.price)return KE('err_money');
 addTx(-U.price,'UPGRADE',t('upg_'+id));S.today.upgrade=(S.today.upgrade||0)+U.price;S.upg[id]=true;applyUpgrades();return KO('UPGRADE')}

/* ================= 3. SAVE / LOAD ================= */
function serialize(){return JSON.stringify(S)}
function mapOld(r){const L=LEGACY[r];return L?{r:L[0],top:L[1].slice()}:{r,top:[]}}
function migrateV1(d){ /* save Phase 1 → v2 */
 d.v=2;const inv=d.inv||{};inv.tra=(inv.tra||0)+(inv.trachanh||0);delete inv.trachanh;
 for(const it of ITEMS)if(inv[it.id]==null)inv[it.id]=it.start;d.inv=inv;
 d.k=emptyKitchen();d.hand=null;d.sel={};delete d.stations;
 d.tray=(d.tray||[]).map(r=>{const m=mapOld(r);return{r:m.r,top:m.top,q:100}}).filter(x=>MENU_BY[x.r]);
 for(const c of d.customers||[]){
  if(c.order){c.order.items=c.order.items.map(it=>{const m=mapOld(it.r);return{r:m.r,top:it.top||m.top,done:!!it.done}}).filter(it=>MENU_BY[it.r]);if(!c.order.items.length)c.order=null}
  c.preferredFood=mapOld(c.preferredFood).r;c.preferredDrink=mapOld(c.preferredDrink).r}
 const fix=o=>{if(!o)return o;const s={};for(const k in o){const r=mapOld(k).r;s[r]=(s[r]||0)+o[k]}return s};
 if(d.today)d.today.sold=fix(d.today.sold);if(d.report)d.report.sold=fix(d.report.sold)}
function migrateV2(d){ /* save Phase 2/3 → v3: bếp mới, khay → carry, Quầy ra món, hàng chờ mới */
 d.v=3;d.seq=Object.assign({c:0,tx:0,order:1000,dish:0},d.seq||{});
 d.carry=(d.tray||[]).filter(x=>x&&MENU_BY[x.r]).map(x=>({id:++d.seq.dish,r:MENU_BY[x.r].id,top:x.top||[],q:x.q==null?100:x.q}));delete d.tray;
 d.pickup=Array(CFG.PICKUP_N).fill(null);d.k=emptyKitchen();d.hand=null;d.sel={};if(d.staff)d.staff.hand=null;
 d.settings=d.settings||{};if(d.settings.hints==null)d.settings.hints=d.settings.coach!==false;delete d.settings.coach;delete d.tutSeen;
 for(const c of d.customers||[]){
  if(c.state==='ENTER')c.state='TO_QUEUE';if(c.state==='WAITING')c.state='QUEUE';c.fails=c.fails||0;c.path=c.path||[];
  if(c.order){c.order.items=c.order.items.map(it=>({r:MENU_BY[it.r]?MENU_BY[it.r].id:it.r,top:it.top||[],done:!!it.done})).filter(it=>MENU_BY[it.r]);if(!c.order.items.length)c.order=null}
  if(!c.order&&c.state==='WAITING_FOOD')c.state='PLAYING';
  if(!MENU_BY[c.preferredFood])c.preferredFood='mi_tom';if(!MENU_BY[c.preferredDrink])c.preferredDrink='water'}}
/* Save trước Patch C: có đầu bếp → tặng Quầy ra món; không có → món trên quầy chuyển về khay. Chạy 1 lần. */
function migrateC(d){d.verC=1;d.upg=d.upg||{};let gift=false;
 if(d.staff&&d.staff.type==='cook'&&!d.upg.pickup){d.upg.pickup=true;gift=true}
 if(!d.upg.pickup){const max=d.upg.tray_big?6:CFG.CARRY_MAX;
  for(const x of d.pickup)if(x&&d.carry.length<max)d.carry.push(x);d.pickup=Array(CFG.PICKUP_N).fill(null)}
 return gift}
function deserialize(str){
 const d=JSON.parse(str);if(!d||typeof d!=='object')throw new Error('bad');let mig=false;
 if(d.v===1){migrateV1(d);mig=true}
 if(d.v===2){migrateV2(d);mig=true}
 if(d.v!==CFG.VERSION)throw new Error('version');
 const out=Object.assign(newState(),d);delete out.speed;
 out.inv=Object.assign(Object.fromEntries(ITEMS.map(i=>[i.id,0])),d.inv||{});
 out.settings=Object.assign({sound:true,hints:true},d.settings||{});
 out.k=Object.assign(emptyKitchen(),d.k||{});out.sel=d.sel||{};out.hand=d.hand||null;
 out.carry=Array.isArray(d.carry)?d.carry:[];
 const pu=Array.isArray(d.pickup)?d.pickup.slice(0,CFG.PICKUP_N):[];while(pu.length<CFG.PICKUP_N)pu.push(null);out.pickup=pu;
 out.seq=Object.assign({c:0,tx:0,order:1000,dish:0},d.seq||{});
 out.today=Object.assign(freshToday(out.money),d.today||{});
 out.lots=d.lots||{};out.prices=d.prices||{};out.upg=d.upg||{};
 out.verC=d.verC;if(out.verC==null&&migrateC(out))out._gift=true;
 if(mig)out._migrated=true;return out}
function saveGame(){if(TEST||UI.noSave||!S)return;try{localStorage.setItem(CFG.KEY,serialize())}catch(e){}}
function loadGame(){
 let s=null,fromOld=false;
 try{s=localStorage.getItem(CFG.KEY);if(!s&&!localStorage.getItem('tiemnet_v3_imported')){s=localStorage.getItem(CFG.OLD_KEY);fromOld=!!s}}catch(e){return null}
 if(!s)return null;
 try{const d=deserialize(s);if(d._migrated||fromOld)UI.migrated=true;if(d._gift)UI.gift=true;delete d._migrated;delete d._gift;
  if(fromOld){try{localStorage.setItem('tiemnet_v3_imported','1')}catch(_){}}return d}
 catch(e){try{localStorage.setItem(CFG.KEY+'_backup_'+Date.now(),s)}catch(_){}UI.saveBad=true;return null}}
 /* ================= 4. CUSTOMERS ================= */
function randLook(T){const l={skin:pick(LOOK.skin),hair:pick(LOOK.hair),shirt:pick(LOOK.shirt),pants:pick(LOOK.pants),style:rint(0,3),acc:wpick([0,1,2,3],x=>[4,1.5,1.5,1.5][x]),accColor:pick(LOOK.acc)};
 if(T.id==='gamethu'&&Math.random()<.6)l.acc=3;return l}
function newName(){for(let i=0;i<20;i++){const n=pick(SURN)+' '+pick(GIVEN);if(!S.accounts[n]&&!S.customers.some(c=>c.name===n))return n}return pick(SURN)+' '+pick(GIVEN)+' '+rint(2,99)}
/* ---------- hàng chờ ở quầy ---------- */
const queueList=()=>S.customers.filter(inQueue).sort((a,b)=>a.id-b.id);
const queueIndex=c=>queueList().indexOf(c);
/* Người đầu hàng phải đứng tới quầy rồi mới phục vụ được; người đầu còn đang đi tới thì cả hàng chờ */
const queueFront=()=>{const q=queueList()[0];return q&&(q.state==='QUEUE'||q.state==='SERVING')?q:null};
/* ---------- tâm trạng / kiên nhẫn ---------- */
const moodKey=f=>f>.66?'happy':f>.4?'waiting':f>.15?'impatient':'angry';
const MOOD_ICON={happy:'😊',waiting:'🙂',impatient:'😐',angry:'😠'};
function moodOf(c){
 if(inQueue(c))return{f:clamp(c.patience/c.patienceMax,0,1),ctx:'queue'};
 if(c.state==='WAITING_FOOD')return{f:clamp(c.orderPatience/c.orderPatienceMax,0,1),ctx:'food'};
 if(c.state==='RECHARGE'||c.rechargeReq)return{f:clamp(c.rechargePatience/c.rechargePatienceMax,0,1),ctx:'recharge'};
 return null}
function spawnCustomer(o){
 o=o||{};const per=period(S.time);let acc=null;
 if(!o.type){const names=Object.keys(S.accounts);if(names.length&&Math.random()<.35){const n=pick(names);if(!S.customers.some(c=>c.name===n))acc=S.accounts[n]}}
 const T=o.type?CT[o.type]:acc?CT[acc.type]:wpick(CTYPES,x=>x.w[per]);
 const money=rint(T.money[0]/1000,T.money[1]/1000)*1000,balance=acc?acc.balance:0,pat=Math.round(PAT.queue*T.pat*(S.upg.aircon?1.3:1));
 const c={id:++S.seq.c,name:acc?acc.name:newName(),type:T.id,look:acc?acc.look:randLook(T),money,balance,returning:!!acc,
  state:'TO_QUEUE',x:CFG.DOOR.x,y:CFG.DOOR.y,path:[],flip:false,pcId:null,patienceMax:pat,patience:pat,happiness:70,fails:0,
  gamingTime:rint(T.play[0],T.play[1]),played:0,hunger:rint(0,45),thirst:rint(0,45),
  preferredPC:T.prefer,preferredFood:pick(T.foods),preferredDrink:pick(T.drinks),
  order:null,orderPatience:0,orderPatienceMax:1,lastOrderT:S.time,eatT:0,rechargeReq:0,rechargePatience:0,rechargePatienceMax:1,reqCooldown:0,
  say:null,joke:T.id==='hocsinh'&&Math.random()<.25,askAmt:0,askText:''};
 if(c.joke)c.gamingTime=Math.max(c.gamingTime,180);
 let ask=rint(T.recharge[0]/10000,T.recharge[1]/10000)*10000;if(balance>=30000)ask=0;
 c.askAmt=Math.min(ask,Math.floor(money/10000)*10000);
 c.askText=c.joke?line('joke'):line(T.prefer==='gaming'?'ask_gaming':(Math.random()<.3?'ask_cheap':'ask'));
 const full=queueList().length>=QUEUE_SPOTS.length;
 S.customers.push(c);S.today.visitors++;fx.sfx('bell');
 if(full){c.state='LEAVING';c.rated=true;c.path=[{x:110,y:540},{x:CFG.DOOR.x,y:CFG.DOOR.y}];say(c,line('queue_full'),30);S.today.left++}
 return c}
function maybeSpawn(dt){
 if(NOSPAWN)return;if(S.customers.length>=S.pcs.length+9)return;
 const p=PERIODS[period(S.time)].rate*(isWeekend(S.day)?1.3:1)*(0.6+S.rating*0.1)*dt;

function moveTo(c,x,y,dt){const dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy),st=CFG.WALK*dt;
 if(d<=st){c.x=x;c.y=y;return true}c.x+=dx/d*st;c.y+=dy/d*st;if(Math.abs(dx)>1)c.flip=dx<0;return false}
function moveAlong(c,dt){let st=CFG.WALK*dt;
 while(st>0&&c.path.length){const p=c.path[0],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);if(Math.abs(dx)>1)c.flip=dx<0;
  if(d<=st){c.x=p.x;c.y=p.y;c.path.shift();st-=d}else{c.x+=dx/d*st;c.y+=dy/d*st;st=0}}
 return!c.path.length}
function reqAmount(c){const T=CT[c.type];const a=rint(T.recharge[0]/10000,T.recharge[1]/10000)*10000;return Math.max(0,Math.min(a,Math.floor(cashFree(c)/10000)*10000))}
function rateVisit(c){if(c.rated)return;c.rated=true;const stars=clamp(1+c.happiness/25,1,5);
 S.rating=clamp(S.rating*.92+stars*.08,1,5);S.today.happySum+=c.happiness;S.today.happyN++}
function saveAccount(c){if(c.balance<1000&&!c.returning)return;const prev=S.accounts[c.name];
 S.accounts[c.name]={name:c.name,type:c.type,look:c.look,balance:Math.floor(c.balance),visits:(prev?prev.visits:0)+1};
 const keys=Object.keys(S.accounts);if(keys.length>40)delete S.accounts[keys[0]]}
function assignPC(c,pc){
 if(!c||!inQueue(c))return KE('err_cust');
 if(!pc||pc.status!=='AVAILABLE')return KE('err_pc_busy');
 if(c.balance<pc.hourlyRate/4)return KE('err_balance');
 pc.status='RESERVED';pc.currentCustomer=c.id;pc.sessionTime=0;c.pcId=pc.id;c.state='TO_PC';
 const s=seatOf(pc);c.path=[{x:CFG.AISLE_X,y:c.y},{x:CFG.AISLE_X,y:s.y},{x:s.x,y:s.y}];

 if(diff<0){c.happiness-=(CT[c.type].strict?18:8)*-diff;say(c,line('low_tier'))}else c.happiness+=diff>0?4:6;

 if(S.upg.monitor)c.happiness+=CT[c.type].strict?10:6;if(S.upg.chairs){c.happiness+=5;c.gamingTime=Math.round(c.gamingTime*1.2)}
 c.happiness=clamp(c.happiness,0,100);return KO('ASSIGN')}

 if(c.state==='LEAVING')return;const wasSeated=isSeated(c);
 const pc=c.pcId?pcById(c.pcId):null;
 if(pc&&pc.currentCustomer===c.id){pc.status='AVAILABLE';pc.currentCustomer=null;pc.sessionTime=0}
 c.order=null;c.rechargeReq=0;c.pcId=null;if(wasSeated)S.today.served++;rateVisit(c);saveAccount(c);
 c.path=[{x:CFG.AISLE_X,y:c.y},{x:CFG.AISLE_X,y:560},{x:CFG.DOOR.x,y:CFG.DOOR.y}];c.state='LEAVING';fx.sfx('pop')}

/* ---------- gọi món ---------- */
/* Kiên nhẫn chờ món = (nền + tổng thời gian từng món) × hệ số số món × tính cách khách × máy lạnh */
function orderPatienceFor(items,T){const b=items.reduce((s,it)=>s+budgetOf(it),PAT.orderBase),multi=PAT.multi[Math.min(items.length,3)];
 return Math.round(b*multi*T.pat*(S.upg.aircon?1.15:1))}
/* Chỉ gọi món đã mở · ưu tiên món mới trong ngày · giới hạn số món theo ngày · đủ thời gian chơi còn lại */
function maybeOrder(c,force){
 const T=CT[c.type],open=r=>!!(MENU_BY[r]&&isOpenType(MENU_BY[r].type)),intro=introTypes(S.day);
 let items=[],budget=c.money,skipped=false;
 const add=(r,top)=>{if(!open(r))return false;const ratio=priceOf(r)/MENU_BY[r].price;
  if(!force&&ratio>1&&Math.random()<Math.min(.9,(ratio-1)*1.2)){skipped=true;return false}
  const it={r,top:top||[],done:false},p=itemPrice(it);if(p<=budget){items.push(it);budget-=p;return true}return false};
 const choose=(pref,list)=>{const nw=list.filter(r=>intro.includes(MENU_BY[r].type));if(nw.length&&Math.random()<.6)return pick(nw);return open(pref)&&Math.random()<.6?pref:pick(list)};
 const foods=T.foods.filter(open),drinks=T.drinks.filter(open);
 if((c.hunger>=60||force)&&foods.length){const f=choose(c.preferredFood,foods),top=[];
  if(MENU_BY[f].type==='noodle'){if(Math.random()<.55)top.push(pick(TOP_IDS));if(Math.random()<.15){const x=pick(TOP_IDS);if(!top.includes(x))top.push(x)}}
  if(!add(f,top))add(f,[]);const fr=['cavien','bovien','tomvien','xx_chien','holo'].filter(open);if(fr.length&&Math.random()<.2)add(pick(fr),[])}
 if(drinks.length&&(c.thirst>=60||(c.hunger>=60&&!foods.length)||(force&&!items.length)||(items.length&&Math.random()<.5)))add(choose(c.preferredDrink,drinks),[]);
 c.lastOrderT=S.time;
 const mx=maxItemsOn(S.day);if(items.length>mx)items=items.slice(0,mx);
 if(!force){const left=c.gamingTime-c.played,need=()=>items.reduce((s,it)=>s+budgetOf(it),0)+15;
  while(items.length&&need()>left){let k=0;items.forEach((it,i)=>{if(budgetOf(it)>budgetOf(items[k]))k=i});items.splice(k,1)}}
 if(!items.length){if(skipped)say(c,line('pricey'),10);return false}
 c.order={id:++S.seq.order,items,t:S.time};c.state='WAITING_FOOD';
 c.orderPatienceMax=orderPatienceFor(items,T);c.orderPatience=c.orderPatienceMax;
 S.today.orders++;say(c,line('order'),8);fx.sfx('notify');return true}
function finishOrderIfDone(c){if(c.order&&c.order.items.every(i=>i.done)){c.order=null;c.lastOrderT=S.time;
 if(c.state==='WAITING_FOOD'){c.state='EATING';c.eatT=15}say(c,line('thanks'),12)}}
function failOrder(c){
 c.order=null;c.fails=(c.fails||0)+1;c.happiness=clamp(c.happiness-25,0,100);S.today.ordersFailed++;
 c.state='PLAYING';c.lastOrderT=S.time;c.hunger=Math.min(c.hunger,40);c.thirst=Math.min(c.thirst,40);
 if(c.fails>=PAT.failLeave||c.happiness<20){say(c,line('angry_leave'),30);S.today.left++;checkout(c)}else say(c,line('angry_food'),20)}
function markOOS(cid,i){
 const c=custById(cid);if(!c||!c.order)return;const it=c.order.items[i];if(!it||it.done)return;
 c.order.items.splice(i,1);c.happiness=clamp(c.happiness-5,0,100);say(c,line('oos'),12);fx.toast(t('toast_oos',{item:menuName(it.r)}));
 if(!c.order.items.length){c.order=null;c.lastOrderT=S.time;if(c.state==='WAITING_FOOD')c.state='PLAYING'}else finishOrderIfDone(c)}
/* ---------- mỗi phút game của khách đang ngồi máy ----------
   Hết giờ chơi / hết tiền máy mà còn món đang chờ → ngồi chờ tiếp, không tính tiền máy */
function seatedTick(c,dt){
 const T=CT[c.type],pc=pcById(c.pcId);if(!pc){checkout(c);return}
 const pending=!!(c.order&&c.order.items.some(i=>!i.done)),timeUp=c.played>=c.gamingTime,cost=pc.hourlyRate/60*dt,playing=!timeUp&&c.balance>=cost;
 if(!playing&&!pending){
  if(timeUp){say(c,line('bye'),30);checkout(c);return}
  c.balance=0;const amt=c.rechargeReq||reqAmount(c);
  if(amt>0){c.rechargeReq=amt;c.state='RECHARGE';c.rechargePatienceMax=Math.round(PAT.recharge*T.pat);
   c.rechargePatience=Math.max(c.rechargePatience,c.rechargePatienceMax*.6);say(c,line(c.joke?'more':'recharge',{amt:vk(amt)}))}
  else{say(c,line('broke'),30);checkout(c)}return}
 if(playing){c.balance-=cost;pc.revenue+=cost;pc.sessionTime+=dt;S.today.pcUsage+=cost;S.today.pcMinutes+=dt;c.played+=dt;c.hunger+=T.hunger*.7*dt;c.thirst+=T.thirst*.7*dt}
 c.waitOnly=!playing;
 if(c.state==='EATING'){c.eatT-=dt;if(c.eatT<=0)c.state=c.order?'WAITING_FOOD':'PLAYING'}
 else if(c.state==='WAITING_FOOD'){
  const ready=orderReady(c),m0=moodKey(c.orderPatience/c.orderPatienceMax);
  c.orderPatience-=dt*(ready?PAT.drainReady:playing?PAT.drainPlaying:PAT.drainWait);
  const m1=moodKey(c.orderPatience/c.orderPatienceMax);
  if(m1!==m0){if(m1==='impatient')say(c,line(ready?'ready_wait':'impatient'),12);else if(m1==='angry')say(c,line(ready?'ready_wait':'angry_food'),12)}
  if(c.orderPatience<=0){failOrder(c);return}}
 else if(playing&&c.state==='PLAYING'&&!c.order&&S.phase==='OPEN'&&S.time-c.lastOrderT>=25&&(c.hunger>=60||c.thirst>=60))maybeOrder(c,false);
 if(!playing)return;
 if(c.rechargeReq){c.rechargePatience-=dt*.7;if(c.rechargePatience<=0){c.rechargeReq=0;c.reqCooldown=S.time+60;c.happiness=clamp(c.happiness-10,0,100)}}
 else if(c.balance<pc.hourlyRate/60*12&&c.played<c.gamingTime-20&&S.time>=c.reqCooldown){
  const amt=reqAmount(c);
  if(amt>0){c.rechargeReq=amt;c.rechargePatienceMax=Math.round(PAT.recharge*T.pat);c.rechargePatience=c.rechargePatienceMax;say(c,line(c.joke?'more':'recharge',{amt:vk(amt)}));fx.sfx('notify')}
  else c.reqCooldown=S.time+60}}
function updCustomer(c,dt){
 switch(c.state){
  case'TO_QUEUE':case'QUEUE':case'SERVING':{
   const i=queueIndex(c),sp=QUEUE_SPOTS[Math.min(Math.max(i,0),QUEUE_SPOTS.length-1)];
   const arrived=moveTo(c,sp.x,sp.y,dt);
   if(c.state==='TO_QUEUE'&&arrived)c.state='QUEUE';
   if(c.state==='SERVING'&&SERVING!==c.id&&!(S.staff&&S.staff.type==='cashier'&&S.staff.serving===c.id))c.state='QUEUE';
   if(c.state!=='SERVING'){c.patience-=dt*PAT.drainQueue;
    if(c.patience<=0){c.happiness=clamp(c.happiness-40,0,100);say(c,line('angry_wait'),30);S.today.left++;leave(c)}}
   break}
  case'TO_PC':if(moveAlong(c,dt)){const pc=pcById(c.pcId);if(pc)pc.status='OCCUPIED';c.state='PLAYING';c.lastOrderT=S.time;c.flip=false;fx.sfx('pop')}break;
  case'PLAYING':case'WAITING_FOOD':case'EATING':seatedTick(c,dt);break;
  case'RECHARGE':c.rechargePatience-=dt;if(c.rechargePatience<=0){c.happiness=clamp(c.happiness-20,0,100);say(c,line('broke'),30);checkout(c)}break;
  case'LEAVING':if(moveAlong(c,dt))c.gone=true;break}
 if(c.say&&S.time>c.say.until)c.say=null}

function openShop(){if(S.phase!=='PREP')return false;S.phase='OPEN';S.time=CFG.OPEN;fx.sfx('bell');fx.toast(t('toast_open'),'ok');
 if(!TEST&&!NOSPAWN)spawnCustomer();return true}
function stepSim(dt){
 if(S.phase!=='OPEN'&&S.phase!=='CLOSING')return;
 if(S.phase==='OPEN'){S.time=Math.min(CFG.CLOSE,S.time+dt);if(S.time<CFG.LAST_ENTRY)maybeSpawn(dt);
  if(!S.today.warned&&S.time>=1350){S.today.warned=true;fx.toast(t('toast_last'))}}
 stationTick(dt);
 for(const c of S.customers)updCustomer(c,dt);
 S.customers=S.customers.filter(c=>!c.gone);
 if(S.phase==='OPEN'&&S.time>=CFG.CLOSE){S.phase='CLOSING';for(const c of S.customers)sendHome(c);fx.toast(t('toast_closing'))}
 if(S.phase==='CLOSING'&&!S.customers.length){endDay();if(!TEST)saveGame()}}
function endDay(){
 if(S.phase==='REPORT')return S.report;
 const d=S.today,u=S.upg||{},elec=CFG.ELEC_BASE+(u.aircon?20000:0)+Math.round(d.pcMinutes/60*CFG.ELEC_PC_HOUR);
 addTx(-elec,'ELECTRICITY',t('exp_elec'));addTx(-CFG.INTERNET,'INTERNET',t('exp_net'));addTx(-CFG.MAINT,'REPAIR',t('exp_maint'));
 let salary=0;for(const ty in(d.staffDays||{})){const s=STAFF[ty].salary;salary+=s;addTx(-s,'STAFF_SALARY',t('tx_salary',{name:t('staff_'+ty)}))}
 const rev={recharge:d.recharge,food:d.food,drink:d.drink},revenue=d.recharge+d.food+d.drink;
 const exp={purchases:d.purchases,elec,internet:CFG.INTERNET,maint:CFG.MAINT,salary,hire:d.hire||0,upgrade:d.upgrade||0};
 const expense=exp.purchases+exp.elec+exp.internet+exp.maint+exp.salary+exp.hire+exp.upgrade;
 S.report={day:S.day,rev,revenue,exp,expense,profit:revenue-expense,pcUsage:Math.round(d.pcUsage),pcHours:d.pcMinutes/60,visitors:d.visitors,
  served:d.served,left:d.left,orders:d.orders,failed:d.ordersFailed,sat:d.happyN?Math.round(d.happySum/d.happyN):0,sold:{...d.sold}};
 S.history.push({day:S.day,revenue,expense,profit:revenue-expense});if(S.history.length>60)S.history.shift();
 S.phase='REPORT';S.k=emptyKitchen();S.hand=null;S.sel={};S.carry=[];S.pickup=Array(CFG.PICKUP_N).fill(null);if(S.staff){S.staff.hand=null;S.staff.serving=null}
 return S.report}
function nextDay(){
 if(S.phase!=='REPORT')return false;if(S.day===1)S.tutorialDone=true;
 S.day++;S.time=CFG.OPEN-30;S.phase='PREP';S.today=freshToday(S.money);S.tx=[];S.report=null;S.customers=[];
 S.pcs.forEach(p=>{p.status='AVAILABLE';p.currentCustomer=null;p.sessionTime=0});
 S.today.staffDays=S.staff?{[S.staff.type]:true}:{};expireLots();return true}
function forecast(){
 const m=(0.6+S.rating*0.1)*(isWeekend(S.day)?1.3:1);const base=PERIODS.reduce((a,p,i)=>a+p.rate*(i===4?60:p.min),0)*m;
 const lo=Math.round(base*.85),hi=Math.round(base*1.15),r=(a,b)=>[Math.round(lo*a),Math.round(hi*b)];
 return{cust:[lo,hi],noodle:r(.35,.5),fried:r(.15,.3),drink:r(.5,.75)}}
